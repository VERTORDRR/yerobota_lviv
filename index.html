                                : inv.status === 'declined'
                                ? '❌ Відхилено'
                                : '⏳ Очікує відповіді'
                            }

                          ${

                              ? `<button type="button" onclick="openReputationModal('${worker.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 text-xs font-bold">

                        </div>
                      </div>

              </div>`;
      } else if (ui.cabinetSubTab === 'payments') {
        bodyHtml =
          myPayments.length === 0
            ? `<div class="bg-white rounded-3xl border border-slate-200 p-10 text-center">
                <div class="text-3xl mb-3">💳</div>
                <h3 class="text-lg font-extrabold text-slate-900 mb-1">Історія оплат Monobank порожня</h3>
                <p class="text-xs text-slate-500">Тут з'являться ваші замовлення на просування вакансій чи додаткові публікації.</p>
              </div>`
            : `<div class="space-y-3">
                ${myPayments
                  .map(
                    (p) => `
                      <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <div class="flex items-center gap-2 mb-1">
                            <span class="px-2.5 py-0.5 rounded-lg bg-[#0F172A] text-amber-400 font-mono text-xs font-black">${escapeHtml(p.orderCode)}</span>
                            <span class="text-xs text-slate-400">${formatDate(p.createdAt)}</span>
                          </div>
                          <div class="text-sm font-bold text-slate-900">${escapeHtml(p.serviceTitle)}</div>
                        </div>
                        <div class="flex items-center gap-3">
                          <span class="text-sm font-black text-slate-900">${p.amount} грн</span>
                          <span class="px-3 py-1 rounded-full text-xs font-extrabold ${
                            p.status === 'approved'
                              ? 'bg-emerald-100 text-emerald-900'
                              : p.status === 'rejected'
                              ? 'bg-rose-100 text-rose-700'
                              : 'bg-amber-100 text-amber-900'
                          }">
                            ${
                              p.status === 'approved'
                                ? '✅ Підтверджено'
                                : p.status === 'rejected'
                                ? '❌ Відхилено'
                                : '⏳ На перевірці'

                  .join('')}
              </div>`;
      } else if (ui.cabinetSubTab === 'profile') {
        bodyHtml = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <form onsubmit="handleUpdateEmployerProfile(event)" class="lg:col-span-2 bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-4">
              <h3 class="text-lg font-extrabold text-slate-900 border-b border-slate-100 pb-3">Контакти роботодавця</h3>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Ім'я / Компанія *</label>
                  <input type="text" name="name" required value="${escapeHtml(user.name)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Телефон (+380...) *</label>

              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Telegram (@username)</label>
                  <input type="text" name="telegram" value="${escapeHtml(user.telegram || '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Viber</label>
                  <input type="text" name="viber" value="${escapeHtml(user.viber || '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />

              </div>
              <button type="submit" class="px-6 py-3 rounded-xl bg-[#0F172A] hover:bg-emerald-600 text-white text-xs sm:text-sm font-extrabold">
                💾 Зберегти контакти

            </form>
            <div>
              ${renderChangePasswordBox()}

          </div>
        `;
      }

      return `
        <section class="space-y-4 sm:space-y-5">
          <!-- Шапка кабінету роботодавця -->
          <div class="bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3.5">
              <div class="w-13 h-13 sm:w-14 sm:h-14 rounded-2xl bg-[#0F172A] text-amber-400 font-black text-2xl flex items-center justify-center shrink-0">
                💼
              </div>
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <h1 class="text-lg sm:text-2xl font-extrabold text-slate-900">${escapeHtml(user.name)}</h1>
                  <span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-950 text-xs font-extrabold">${stats.label} (${stats.count})</span>
                  <span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 text-xs font-bold">✅ Виконано: ${stats.completedTasks}</span>
                </div>
                <p class="text-xs text-slate-500 mt-0.5">
                  Роботодавець • ${escapeHtml(user.phone)} • ${escapeHtml(user.email)}
                </p>

            </div>

            <button
              type="button"
              onclick="openJobFormModal()"
              class="px-5 py-3.5 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs sm:text-sm shadow-md transition self-start md:self-auto"

                  <button

                      ui.cabinetSubTab === t.id
                        ? 'bg-[#0F172A] text-white border-[#0F172A]'
                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'

                    ${t.label}

              )
              .join('')}
          </div>

          ${bodyHtml}

    function renderChangePasswordBox() {
      return `
        <form onsubmit="handleChangePasswordSubmit(event)" class="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm space-y-3">
          <h4 class="text-sm font-extrabold text-slate-900">🔐 Зміна пароля</h4>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Поточний пароль</label>
            <input type="password" name="oldPassword" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Новий пароль (мін. 4 символи)</label>
            <input type="password" name="newPassword" required minlength="4" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-[#0F172A] hover:bg-slate-800 text-white text-xs font-extrabold transition">
            Оновити пароль
          </button>
        </form>
      `;
    }

    function handleChangePasswordSubmit(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;
      const fd = new FormData(e.target);
      const oldPass = String(fd.get('oldPassword') || '');
      const newPass = String(fd.get('newPassword') || '');

      if (user.password !== oldPass) {
        showToast('Поточний пароль вказано невірно.', 'error');
        return;
      }
      if (newPass.length < 4) {
        showToast('Новий пароль має містити мінімум 4 символи.', 'error');
        return;
      }
      user.password = newPass;
      saveState();
      e.target.reset();
      showToast('Пароль успішно змінено!', 'success');
    }

    function handleUpdateEmployerProfile(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user || user.role !== 'employer') return;

      const fd = new FormData(e.target);
      user.name = String(fd.get('name') || '').trim();
      user.phone = String(fd.get('phone') || '').trim();
      user.telegram = String(fd.get('telegram') || '').trim();
      user.viber = String(fd.get('viber') || '').trim();
      saveState();
      triggerHaptic('medium');
      showToast('Контактні дані оновлено!', 'success');
      renderApp();
    }

    function toggleJobActiveStatus(jobId) {
      triggerHaptic('light');
      const job = state.jobs.find((j) => j.id === jobId);
      if (!job) return;
      job.status = job.status === 'active' ? 'inactive' : 'active';
      saveState();
      showToast(
        job.status === 'active'
          ? '🟢 Вакансію активовано! Тепер її бачать виконавці.'
          : '⚪ Вакансію приховано з пошуку.',
        'info'
      );
      renderApp();
    }

    function updateApplicationStatus(appId, status) {
      triggerHaptic('medium');
      const app = state.applications.find((a) => a.id === appId);
      if (!app) return;
      app.status = status;
      saveState();
      showToast(status === 'accepted' ? 'Виконавця обрано!' : 'Відгук відхилено.', 'success');
      renderApp();
    }

    function confirmDeleteJob(jobId) {
      showConfirmModal({
        title: 'Видалити пропозицію роботи?',
        message: 'Цю вакансію буде остаточно видалено зі списку.',
        confirmText: 'Видалити',
        onConfirm: () => {
          state.jobs = state.jobs.filter((j) => j.id !== jobId);
          saveState();
          showToast('Пропозицію видалено.', 'info');
          renderApp();
        },
      });
    }

    function promoteJob(jobId, serviceType) {
      const job = state.jobs.find((j) => j.id === jobId);
      if (!job) return;
      const isTop = serviceType === 'top_job';
      openMonobankPaymentModal({
        serviceType,
        targetId: job.id,
        serviceTitle: isTop
          ? `⭐ Підняти в ТОП: ${job.title}`
          : `🔥 Позначка Терміново: ${job.title}`,
        baseAmount: isTop
          ? Number(state.settings.priceTopJob) || 80
          : Number(state.settings.priceUrgentJob) || 40,
      });
    }

    /*************************************************************************
     * 13. СТВОРЕННЯ / РЕДАГУВАННЯ ВАКАНСІЇ З КАРТОЮ LEAFLET (ТІЛЬКИ РОБОТОДАВЕЦЬ)
     *************************************************************************/
    function openJobFormModal(editJobId = null) {
      const currentUser = getCurrentUser();
      if (!currentUser || currentUser.role !== 'employer') {
        showToast('Виставляти пропозиції роботи можуть лише зареєстровані роботодавці.', 'error');
        return;
      }

      const editingJob = editJobId ? state.jobs.find((j) => j.id === editJobId) : null;
      const defaultDistrict = editingJob ? editingJob.district : LVIV_DISTRICTS[0].name;
      const coords = editingJob
        ? { lat: Number(editingJob.lat), lng: Number(editingJob.lng) }
        : getDistrictCoords(defaultDistrict);

      closeAllModals();
      triggerHaptic('light');
      updateTelegramClosingConfirmation(true);

      const districtOptions = LVIV_DISTRICTS.map(
        (d) =>
          `<option value="${escapeHtml(d.name)}" ${defaultDistrict === d.name ? 'selected' : ''}>${escapeHtml(d.name)}</option>`
      ).join('');

      const categoryOptions = JOB_CATEGORIES.map(
        (c) =>
          `<option value="${escapeHtml(c)}" ${
            editingJob && editingJob.category === c ? 'selected' : ''
          }>${escapeHtml(c)}</option>`
      ).join('');

      const myJobsCount = state.jobs.filter((j) => j.employerId === currentUser.id).length;
      const totalFreeLimit = (Number(state.settings.freeJobsLimit) || 0) + (Number(currentUser.bonusFreeSlots) || 0);
      const requiresExtraPayment = !editingJob && myJobsCount >= totalFreeLimit;

      const root = document.getElementById('modal-root');
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/65 backdrop-blur-sm overflow-y-auto';
      modal.innerHTML = `
        <div class="bg-white rounded-3xl max-w-2xl w-full p-5 sm:p-7 shadow-2xl border border-slate-200 my-auto animate-modal max-h-[92vh] overflow-y-auto">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">
                ${editingJob ? '✏️ Редагувати пропозицію роботи' : '💼 Нова пропозиція роботи у Львові'}
              </h2>
              <p class="text-xs text-slate-500">Заповніть деталі та позначте місце на карті Львова</p>
            </div>
            <button type="button" onclick="closeAllModals()" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100">✕</button>
          </div>

          ${
            requiresExtraPayment
              ? `<div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-300 text-xs text-amber-950 mb-4">
                  💡 Безкоштовний ліміт (${totalFreeLimit} публікації) використано. Після збереження відкриється оплата через Monobank (<strong>${state.settings.priceExtraPost} грн</strong>) із кодом замовлення.
                </div>`
              : ''
          }

          <form onsubmit="handleJobFormSubmit(event, ${editingJob ? `'${editingJob.id}'` : 'null'})" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Назва роботи / вакансії *</label>
                <input
                  type="text"
                  name="title"
                  required
                  value="${editingJob ? escapeHtml(editingJob.title) : ''}"
                  placeholder="Напр.: Потрібні 2 вантажники на переїзд"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Категорія *</label>
                <select name="category" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                  ${categoryOptions}
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Оплата (сума та формат) *</label>
                <input
                  type="text"
                  name="pay"
                  required
                  value="${editingJob ? escapeHtml(editingJob.pay) : ''}"
                  placeholder="Напр.: 1400 грн/зміна або 250 грн/год"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Коли / Графік</label>
                <input
                  type="text"
                  name="schedule"
                  value="${editingJob ? escapeHtml(editingJob.schedule || '') : ''}"
                  placeholder="Напр.: Завтра з 09:00 до 17:00"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm"
                />
              </div>
            </div>

            <!-- Швидкі теги умов -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">Особливості підробітку</label>
              <div class="flex flex-wrap gap-2">
                ${QUICK_JOB_TAGS.map((qt) => {
                  const checked = editingJob && Array.isArray(editingJob.tags) && editingJob.tags.includes(qt.id);
                  return `
                    <label class="cursor-pointer select-none">
                      <input type="checkbox" name="tags" value="${qt.id}" ${checked ? 'checked' : ''} class="peer sr-only" />
                      <span class="inline-block px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold text-slate-700 peer-checked:bg-[#0F172A] peer-checked:text-white peer-checked:border-[#0F172A] transition">
                        ${qt.label}
                      </span>
                    </label>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Район / передмістя Львова *</label>
                <select
                  name="district"
                  id="job-form-district"
                  onchange="onJobFormDistrictChange(this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"
                >
                  ${districtOptions}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Вулиця / орієнтир</label>
                <input
                  type="text"
                  name="address"
                  value="${editingJob ? escapeHtml(editingJob.address || '') : ''}"
                  placeholder="Напр.: просп. Червоної Калини, біля Іскри"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm"

              </div>
            </div>

            <!-- Інтерактивна карта вибору точної точки -->
            <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="text-xs font-bold text-slate-700">
                  📍 Точна точка на карті Львова (натисніть або перетягніть маркер)
                </span>
                <button
                  type="button"
                  onclick="useMyGeolocationOnJobMap()"
                  class="px-3 py-1.5 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-900 text-xs font-extrabold transition"

                  📍 Моя геолокація
                </button>
              </div>
              <div id="job-form-map" class="w-full h-48 rounded-xl border border-slate-300 overflow-hidden"></div>
              <input type="hidden" name="lat" id="job-form-lat" value="${coords.lat}" />
              <input type="hidden" name="lng" id="job-form-lng" value="${coords.lng}" />
              <div class="text-[11px] text-slate-500" id="job-form-coords-label">
                Координати: ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Детальний опис умов та вимог *</label>
              <textarea
                name="description"
                rows="3"
                required
                placeholder="Опишіть обов'язки, вимоги та спосіб виплати..."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm"

            <div class="flex items-center justify-end gap-2.5 pt-2">
              <button type="button" onclick="closeAllModals()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs sm:text-sm font-bold hover:bg-slate-50">
                Скасувати
              </button>
              <button type="submit" class="px-6 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs sm:text-sm font-extrabold shadow-md transition">
                ${editingJob ? '💾 Зберегти зміни' : '🚀 Опублікувати пропозицію'}
              </button>
            </div>
          </form>
        </div>
      `;

      root.appendChild(modal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeAllModals();
      });

      setTimeout(() => {
        const mapEl = document.getElementById('job-form-map');
        if (mapEl && typeof L !== 'undefined') {
          formMapInstance = L.map('job-form-map').setView([coords.lat, coords.lng], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
          }).addTo(formMapInstance);

          formMarkerInstance = L.marker([coords.lat, coords.lng], { draggable: true }).addTo(formMapInstance);

          formMarkerInstance.on('dragend', () => {
            const pos = formMarkerInstance.getLatLng();
            setJobFormCoords(pos.lat, pos.lng);
          });

          formMapInstance.on('click', (e) => {
            formMarkerInstance.setLatLng(e.latlng);
            setJobFormCoords(e.latlng.lat, e.latlng.lng);
          });

          formMapInstance.invalidateSize();
        }
      }, 120);
    }

    function setJobFormCoords(lat, lng) {
      const latInput = document.getElementById('job-form-lat');
      const lngInput = document.getElementById('job-form-lng');
      const label = document.getElementById('job-form-coords-label');
      if (latInput) latInput.value = lat;
      if (lngInput) lngInput.value = lng;
      if (label) label.textContent = `Координати: ${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}`;
    }

    function onJobFormDistrictChange(districtName) {
      const c = getDistrictCoords(districtName);
      setJobFormCoords(c.lat, c.lng);
      if (formMapInstance && formMarkerInstance) {
        formMapInstance.setView([c.lat, c.lng], 14);
        formMarkerInstance.setLatLng([c.lat, c.lng]);
      }
    }

    function useMyGeolocationOnJobMap() {
      triggerHaptic('light');
      if (!navigator.geolocation) {
        showToast('Ваш браузер не підтримує геолокацію.', 'error');
        return;
      }
      showToast('Визначаємо ваше місцезнаходження...', 'info');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          setJobFormCoords(latitude, longitude);
          if (formMapInstance && formMarkerInstance) {
            formMapInstance.setView([latitude, longitude], 16);
            formMarkerInstance.setLatLng([latitude, longitude]);
          }
          showToast('Точку встановлено за вашою геолокацією!', 'success');
        },
        () => {
          showToast('Не вдалося отримати геолокацію. Поставте маркер вручну на карті.', 'warning');
        }
      );
    }

    function handleJobFormSubmit(e, editJobId) {
      e.preventDefault();
      const currentUser = getCurrentUser();
      if (!currentUser || currentUser.role !== 'employer') return;

      const fd = new FormData(e.target);
      const title = String(fd.get('title') || '').trim();
      const category = String(fd.get('category') || JOB_CATEGORIES[0]);
      const pay = String(fd.get('pay') || '').trim();
      const schedule = String(fd.get('schedule') || '').trim();
      const district = String(fd.get('district') || LVIV_DISTRICTS[0].name);
      const address = String(fd.get('address') || '').trim();
      const description = String(fd.get('description') || '').trim();
      const tags = fd.getAll('tags').map(String);
      const lat = Number(fd.get('lat')) || getDistrictCoords(district).lat;
      const lng = Number(fd.get('lng')) || getDistrictCoords(district).lng;

      if (!title || !pay || !description) {
        showToast('Заповніть усі обов’язкові поля вакансії.', 'error');
        return;
      }

      if (editJobId) {
        const job = state.jobs.find((j) => j.id === editJobId);
        if (job) {
          Object.assign(job, { title, category, pay, schedule, district, address, description, tags, lat, lng });
          saveState();
          closeAllModals();
          triggerHaptic('medium');
          showToast('Пропозицію роботи оновлено!', 'success');
          renderApp();
        }
        return;
      }

      const myJobsCount = state.jobs.filter((j) => j.employerId === currentUser.id).length;
      const totalFreeLimit = (Number(state.settings.freeJobsLimit) || 0) + (Number(currentUser.bonusFreeSlots) || 0);
      const needsPayment = myJobsCount >= totalFreeLimit;

      const newJob = {
        id: generateId('job'),
        employerId: currentUser.id,
        title,
        category,
        district,
        address,
        lat,
        lng,
        pay,
        schedule,
        tags,
        description,
        status: needsPayment ? 'inactive' : 'active',
        isTop: false,
        isUrgent: false,
        isHiddenByAdmin: false,
        createdAt: Date.now(),
      };

      state.jobs.push(newJob);
      saveState();
      closeAllModals();
      triggerHaptic('medium');

      if (needsPayment) {
        showToast('Вакансію збережено! Оплатіть додаткову публікацію, щоб активувати її.', 'info');
        openMonobankPaymentModal({
          serviceType: 'extra_post',
          targetId: newJob.id,
          serviceTitle: `Додаткова публікація вакансії: ${newJob.title}`,
          baseAmount: Number(state.settings.priceExtraPost) || 50,
        });
      } else {
        showToast('🎉 Пропозицію роботи опубліковано у Львові!', 'success');
        navigateTo('jobs');
      }
    }

                    ⚠️ Адміністратор ще не додав посилання на Монобанку або номер картки. Ви можете надіслати заявку з кодом <strong>${orderCode}</strong>.
                  </div>`

            }

            ${

                ? `<div class="p-4 rounded-2xl bg-[#0F172A] text-white space-y-3">
                    <div class="flex items-center justify-between">

                      <span class="text-[11px] px-2 py-0.5 rounded bg-white/10 text-amber-300 font-bold">1 клік</span>
                    </div>
                    <a
                      href="${escapeHtml(s.monoJarUrl)}"
                      target="_blank"

                            <span class="text-[10px] text-slate-400 mt-1.5">Відскануйте камерою телефону для оплати</span>

    function applyPaymentPromoCode() {
      triggerHaptic('light');
      if (!activePaymentDraft) return;
      const input = document.getElementById('payment-promo-input');
      if (!input) return;
      const code = input.value.trim().toUpperCase();
      if (!code) return;

      const found = (state.settings.promoCodes || []).find((p) => p.code.toUpperCase() === code);
      if (!found) {
        showToast('Промокод не знайдено або він недійсний.', 'error');
        return;
      }

      const discount = Math.min(100, Math.max(0, Number(found.discountPercent) || 0));
      const newAmount = Math.max(0, Math.round(activePaymentDraft.baseAmount * (1 - discount / 100)));
      activePaymentDraft.finalAmount = newAmount;
      activePaymentDraft.promoUsed = found.code;

      const amountEl = document.getElementById('payment-final-amount');
      if (amountEl) {
        amountEl.textContent = newAmount === 0 ? '0 грн (Безкоштовно!)' : `${newAmount} грн (-${discount}%)`;
      }
      showToast(`Промокод ${found.code} застосовано (-${discount}%)!`, 'success');
    }

    function handleReceiptFileSelect(input) {
      if (!input.files || !input.files[0]) return;
      processReceiptFile(input.files[0]);
    }

    function processReceiptFile(file) {
      if (!activePaymentDraft) return;
      const statusEl = document.getElementById('receipt-file-status');
      activePaymentDraft.receiptName = file.name || `receipt_${Date.now()}.png`;
      activePaymentDraft.receiptMime = file.type;

      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 820;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            activePaymentDraft.receiptDataUrl = canvas.toDataURL('image/jpeg', 0.75);
            activePaymentDraft.receiptMime = 'image/jpeg';
            if (statusEl) statusEl.textContent = `✅ Скріншот готовий до відправки: ${activePaymentDraft.receiptName}`;
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = (ev) => {
          activePaymentDraft.receiptDataUrl = ev.target.result;
          if (statusEl) statusEl.textContent = `✅ PDF-квитанція готова: ${activePaymentDraft.receiptName}`;
        };
        reader.readAsDataURL(file);
      }
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(',');
      const mimeMatch = parts[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
      const raw = atob(parts[1]);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) {
        arr[i] = raw.charCodeAt(i);
      }
      return new Blob([arr], { type: mime });
    }

    async function submitUserMonobankPayment() {
      const currentUser = getCurrentUser();
      if (!currentUser || !activePaymentDraft) return;

      const btn = document.getElementById('btn-submit-mono-payment');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Надсилаємо...';
      }

      const isZeroPromo = activePaymentDraft.finalAmount === 0 && activePaymentDraft.promoUsed;

      const paymentRecord = {
        id: generateId('pay'),
        orderCode: activePaymentDraft.orderCode,
        userId: currentUser.id,
        serviceType: activePaymentDraft.serviceType,
        targetId: activePaymentDraft.targetId,
        serviceTitle: activePaymentDraft.serviceTitle,
        amount: activePaymentDraft.finalAmount,
        promoUsed: activePaymentDraft.promoUsed,
        receiptDataUrl: activePaymentDraft.receiptDataUrl,
        receiptName: activePaymentDraft.receiptName,
        receiptMime: activePaymentDraft.receiptMime,
        status: isZeroPromo ? 'approved' : 'pending',
        createdAt: Date.now(),
      };

      state.payments.push(paymentRecord);

      if (isZeroPromo) {
        activatePaidServiceEffect(paymentRecord);
        saveState();
        closeAllModals();
        triggerHaptic('medium');
        showToast('🎉 Послугу миттєво активовано за 100% промокодом!', 'success');
        renderApp();
        return;
      }

      saveState();
      await forwardReceiptToOwnerTelegramBot(paymentRecord, currentUser);
      closeAllModals();
      triggerHaptic('medium');
      showToast(
        `Заявку ${paymentRecord.orderCode} надіслано! Адміністратор перевірить оплату та активує послугу.`,
        'success'
      );
      renderApp();
    }

    // Автоматична відправка квитанції (sendPhoto / sendDocument) або тексту (sendMessage) в Telegram-бот власника
    async function forwardReceiptToOwnerTelegramBot(payment, user) {
      const token = (state.settings.tgBotToken || '').trim();
      const chatId = (state.settings.tgChatId || '').trim();
      if (!token || !chatId) return;

      const caption = [
        `💳 Нова оплата Monobank — Підробіток.Львів`,
        `🔖 Код замовлення (підпис): #${payment.orderCode}`,
        `💰 Сума: ${payment.amount} грн`,
        `📦 Послуга: ${payment.serviceTitle}`,
        `👤 Платник: ${user.name}`,
        `📞 Телефон: ${user.phone}`,
        user.telegram ? `✈️ Telegram: ${formatTelegramDisplay(user.telegram)}` : '',
      ]
        .filter(Boolean)
        .join('\n');

      try {
        if (payment.receiptDataUrl && payment.receiptDataUrl.startsWith('data:image/')) {
          const blob = dataUrlToBlob(payment.receiptDataUrl);
          const formData = new FormData();
          formData.append('chat_id', chatId);
          formData.append('photo', blob, payment.receiptName || `${payment.orderCode}.jpg`);
          formData.append('caption', caption);

          const res = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
            method: 'POST',
            body: formData,
          });
          if (res.ok) return;
        } else if (payment.receiptDataUrl && payment.receiptDataUrl.startsWith('data:application/pdf')) {
          const blob = dataUrlToBlob(payment.receiptDataUrl);
          const formData = new FormData();
          formData.append('chat_id', chatId);
          formData.append('document', blob, payment.receiptName || `${payment.orderCode}.pdf`);
          formData.append('caption', caption);

          const res = await fetch(`https://api.telegram.org/bot${token}/sendDocument`, {
            method: 'POST',
            body: formData,
          });
          if (res.ok) return;
        }

        // Текстове повідомлення (якщо без файлу або як резерв)
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            text: caption,
          }),
        });
      } catch (err) {
        console.warn('Telegram Bot API notification error:', err);
      }
    }

    function activatePaidServiceEffect(payment) {
      if (payment.serviceType === 'extra_post' && payment.targetId) {
        const job = state.jobs.find((j) => j.id === payment.targetId);
        if (job) job.status = 'active';
      } else if (payment.serviceType === 'top_job' && payment.targetId) {
        const job = state.jobs.find((j) => j.id === payment.targetId);
        if (job) job.isTop = true;
      } else if (payment.serviceType === 'urgent_job' && payment.targetId) {
        const job = state.jobs.find((j) => j.id === payment.targetId);
        if (job) job.isUrgent = true;
      }
    }

    function openReceiptPreviewModal(paymentId) {
      const p = state.payments.find((item) => item.id === paymentId);
      if (!p || !p.receiptDataUrl) return;
      closeAllModals();
      updateTelegramClosingConfirmation(true);

      const isPdf = p.receiptMime === 'application/pdf' || p.receiptDataUrl.startsWith('data:application/pdf');
      const root = document.getElementById('modal-root');
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm';
      modal.innerHTML = `
        <div class="bg-white rounded-3xl max-w-2xl w-full p-5 shadow-2xl border border-slate-200 animate-modal max-h-[90vh] overflow-y-auto">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-base font-extrabold text-slate-900">
              Квитанція замовлення <span class="font-mono text-emerald-700">${escapeHtml(p.orderCode)}</span> (${p.amount} грн)
            </h3>
            <button type="button" onclick="closeAllModals()" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100">✕</button>
          </div>
          ${
            isPdf
              ? `<iframe src="${p.receiptDataUrl}" class="w-full h-[65vh] rounded-2xl border border-slate-200"></iframe>`
              : `<img src="${p.receiptDataUrl}" alt="Квитанція ${escapeHtml(p.orderCode)}" class="max-h-[68vh] w-auto mx-auto rounded-2xl border border-slate-200 shadow" />`
          }
        </div>
      `;
      root.appendChild(modal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeAllModals();
      });
    }

    function adminProcessPayment(paymentId, decision) {
      triggerHaptic('medium');
      const payment = state.payments.find((p) => p.id === paymentId);
      if (!payment) return;

      payment.status = decision;
      if (decision === 'approved') {
        activatePaidServiceEffect(payment);
        showToast(`Оплату ${payment.orderCode} підтверджено, послугу активовано!`, 'success');
      } else {
        showToast(`Заявку ${payment.orderCode} відхилено.`, 'info');
      }
      saveState();
      renderApp();
    }

    function handleAdminMonobankSettingsSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.settings.monoJarEnabled = fd.get('monoJarEnabled') === 'on';
      state.settings.monoJarShowQr = fd.get('monoJarShowQr') === 'on';
      state.settings.monoJarUrl = String(fd.get('monoJarUrl') || '').trim();
      state.settings.monoCardEnabled = fd.get('monoCardEnabled') === 'on';
      state.settings.monoCardNumber = String(fd.get('monoCardNumber') || '').trim();
      state.settings.monoCardHolder = String(fd.get('monoCardHolder') || '').trim();
      state.settings.monoIban = String(fd.get('monoIban') || '').trim();
      state.settings.freeJobsLimit = Math.max(0, Number(fd.get('freeJobsLimit') || 0));
      state.settings.priceExtraPost = Math.max(0, Number(fd.get('priceExtraPost') || 0));
      state.settings.priceTopJob = Math.max(0, Number(fd.get('priceTopJob') || 0));
      state.settings.priceUrgentJob = Math.max(0, Number(fd.get('priceUrgentJob') || 0));
      saveState();
      triggerHaptic('medium');
      showToast('Реквізити Monobank та тарифи збережено!', 'success');
    }

    function handleAddPromoCodeSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const code = String(fd.get('code') || '').trim().toUpperCase();
      const discountPercent = Math.min(100, Math.max(1, Number(fd.get('discountPercent') || 10)));
      if (!code) return;

      state.settings.promoCodes = (state.settings.promoCodes || []).filter((p) => p.code !== code);
      state.settings.promoCodes.push({ code, discountPercent });
      saveState();
      e.target.reset();
      showToast(`Промокод ${code} (-${discountPercent}%) додано!`, 'success');
      renderApp();
    }

    function deletePromoCode(code) {
      state.settings.promoCodes = (state.settings.promoCodes || []).filter((p) => p.code !== code);
      saveState();
      showToast(`Промокод ${code} видалено.`, 'info');
      renderApp();
    }

                                    ${
                                      u.role === 'employer'
                                        ? `<button
                                            type="button"
                                            onclick="adminGrantBonusSlot('${u.id}')"
                                            class="px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-950 text-xs font-extrabold"
                                          >
                                            +1 бонусна публікація
                                          </button>`
                                        : u.workerProfile
                                        ? `<button
                                            type="button"
                                            onclick="adminToggleWorkerVisibility('${u.id}')"
                                            class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${
                                              u.workerProfile.isHiddenByAdmin ? 'bg-amber-400 text-slate-950' : 'bg-slate-200 text-slate-800'
                                            }"
                                          >
                                            ${u.workerProfile.isHiddenByAdmin ? '👁️ Показати анкету' : '🙈 Сховати анкету'}
                                          </button>`
                                        : ''
                                    }
                                    <button
                                      type="button"
                                      onclick="adminToggleBlockUser('${u.id}')"
                                      class="px-3 py-1.5 rounded-xl text-xs font-bold ${
                                        u.isBlocked ? 'bg-emerald-500 text-slate-950' : 'bg-rose-100 text-rose-700'
                                      }"
                                    >
                                      ${u.isBlocked ? '🔓 Розблокувати' : '🚫 Заблокувати'}
                                    </button>
                                  </div>
                                </div>
                              `;
                            })
                            .join('')}
                        </div>`
                  }
                </div>`
          }
        </div>
      `;
    }

    function adminToggleJobVisibility(jobId) {
      const job = state.jobs.find((j) => j.id === jobId);
      if (!job) return;
      job.isHiddenByAdmin = !job.isHiddenByAdmin;
      saveState();
      showToast(job.isHiddenByAdmin ? 'Вакансію приховано модератором.' : 'Вакансію знову показано.', 'info');
      renderApp();
    }

    function adminToggleWorkerVisibility(userId) {
      const user = getUserById(userId);
      if (!user || !user.workerProfile) return;
      user.workerProfile.isHiddenByAdmin = !user.workerProfile.isHiddenByAdmin;
      saveState();
      showToast(
        user.workerProfile.isHiddenByAdmin ? 'Анкету виконавця приховано з каталогу.' : 'Анкету виконавця повернуто в каталог.',
        'info'
      );
      renderApp();
    }

    function adminGrantBonusSlot(userId) {
      const user = getUserById(userId);
      if (!user) return;
      user.bonusFreeSlots = (Number(user.bonusFreeSlots) || 0) + 1;
      saveState();
      triggerHaptic('light');
      showToast(`Нараховано +1 безкоштовну публікацію для ${user.name}!`, 'success');
      renderApp();
    }

    function adminToggleBlockUser(userId) {
      const user = getUserById(userId);
      if (!user) return;
      user.isBlocked = !user.isBlocked;
      saveState();
      showToast(user.isBlocked ? `Користувача ${user.name} заблоковано.` : `Користувача ${user.name} розблоковано.`, 'info');
      renderApp();
    }

    // 15.5 Вкладка 5: «🤖 Telegram Бот та Синхронізація»
    function renderAdminTelegramSyncTab() {
      const s = state.settings;
      const baseUrl = window.location.origin + window.location.pathname;
      const botFatherReadyLink = s.firebaseDbUrl
        ? `${baseUrl}?db=${encodeURIComponent(s.firebaseDbUrl)}`
        : baseUrl;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <!-- Блок 1: Налаштування Telegram Бота -->
          <form onsubmit="handleAdminTgBotSubmit(event)" class="bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 class="text-base sm:text-lg font-extrabold text-slate-900">🤖 Сповіщення про оплати в Telegram Бот</h3>
              <span class="px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-900 text-[11px] font-bold">Bot API</span>
            </div>

            <p class="text-xs text-slate-600 leading-relaxed">
              Коли роботодавець надсилає скріншот або PDF-квитанцію Monobank, сайт автоматично відправляє фото/документ із кодом замовлення <strong class="font-mono text-slate-900">#LV-XXXX</strong> прямо у ваш Telegram.
            </p>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Telegram Bot Token (від @BotFather)</label>
              <input
                type="text"
                name="tgBotToken"
                value="${escapeHtml(s.tgBotToken)}"
                placeholder="123456789:AAH..."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-mono text-xs outline-none focus:border-sky-500"
              />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Admin Chat ID (від @userinfobot або ID групи)</label>
              <input
                type="text"
                name="tgChatId"
                value="${escapeHtml(s.tgChatId)}"
                placeholder="512345678 або -100..."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-mono text-xs outline-none focus:border-sky-500"
              />
            </div>

            <div class="flex flex-wrap items-center gap-2.5 pt-1">
              <button type="submit" class="px-5 py-3 rounded-xl bg-[#0F172A] hover:bg-emerald-600 text-white text-xs font-extrabold transition">
                💾 Зберегти налаштування бота
              </button>
              <button
                type="button"
                onclick="sendTestTelegramBotMessage()"
                class="px-4 py-3 rounded-xl bg-sky-100 hover:bg-sky-200 text-sky-950 text-xs font-extrabold transition"
              >
                🧪 Надіслати тестове повідомлення в бот
              </button>
            </div>
          </form>

          <!-- Блок 2: Cloud Sync (Спільна хмарна база даних Firebase) + PIN -->
          <div class="space-y-5">
            <form onsubmit="handleAdminCloudSyncSubmit(event)" class="bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-4">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900">☁️ Спільна хмарна база даних (Cloud Sync)</h3>
                <span class="text-xs font-extrabold ${s.firebaseDbUrl ? 'text-emerald-600' : 'text-slate-400'}">
                  ${s.firebaseDbUrl ? '● Підключено' : '○ Локально'}
                </span>
              </div>

              <p class="text-xs text-slate-600 leading-relaxed">
                Вставте URL безкоштовної <strong>Firebase Realtime Database</strong>, щоб усі користувачі в Telegram Mini App бачили спільну стрічку вакансій, виконавців та оплат у реальному часі.
              </p>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Firebase Realtime Database URL</label>
                <input
                  type="url"
                  name="firebaseDbUrl"
                  value="${escapeHtml(s.firebaseDbUrl)}"
                  placeholder="https://your-project-default-rtdb.firebaseio.com"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-mono text-xs outline-none focus:border-emerald-500"
                />
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <button type="submit" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold transition">
                  💾 Зберегти URL бази
                </button>
                <button
                  type="button"
                  onclick="syncFromCloud(false)"
                  class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-900 text-xs font-extrabold transition"
                >
                  🔄 Синхронізувати зараз
                </button>
              </div>

              <!-- Готове посилання для @BotFather -->
              <div class="p-3.5 rounded-2xl bg-slate-900 text-white space-y-2">
                <div class="text-[11px] font-bold text-amber-400">
                  🔗 Готове посилання для @BotFather (Menu Button / WebApp):
                </div>
                <div class="text-[11px] font-mono text-slate-300 break-all bg-white/10 p-2.5 rounded-xl">
                  ${escapeHtml(botFatherReadyLink)}
                </div>
                <button
                  type="button"
                  onclick="copyToClipboard('${escapeHtml(botFatherReadyLink)}', 'Посилання для @BotFather скопійовано! Вставте його у Configure Menu Button.')"
                  class="w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-extrabold transition"
                >
                  📋 Скопіювати готове посилання для @BotFather
                </button>
              </div>
            </form>

            <!-- Зміна PIN-коду адміністратора -->
            <form onsubmit="handleAdminPinChangeSubmit(event)" class="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm space-y-3">
              <h4 class="text-sm font-extrabold text-slate-900">🔐 Змінити PIN-код власника</h4>
              <div class="flex items-center gap-2">
                <input
                  type="text"
                  name="newPin"
                  required
                  minlength="4"
                  maxlength="12"
                  placeholder="Новий PIN-код (мін. 4 символи)"
                  class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 font-mono text-sm"
                />
                <button type="submit" class="px-4 py-2.5 rounded-xl bg-[#0F172A] hover:bg-slate-800 text-white text-xs font-extrabold">
                  Оновити PIN
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function handleAdminTgBotSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.settings.tgBotToken = String(fd.get('tgBotToken') || '').trim();
      state.settings.tgChatId = String(fd.get('tgChatId') || '').trim();
      saveState();
      triggerHaptic('medium');
      showToast('Налаштування Telegram Бота збережено!', 'success');
    }

    async function sendTestTelegramBotMessage() {
      triggerHaptic('light');
      const token = (state.settings.tgBotToken || '').trim();
      const chatId = (state.settings.tgChatId || '').trim();
      if (!token || !chatId) {
        showToast('Спочатку введіть та збережіть Bot Token і Admin Chat ID.', 'warning');
        return;
      }

      try {
        const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            text: '✅ Тестовий зв’язок успішний! Платформа «Підробіток.Львів» готова надсилати сюди квитанції Monobank та замовлення #LV-XXXX.',
          }),
        });
        const data = await res.json();
        if (data && data.ok) {
          showToast('🎉 Тестове повідомлення успішно надіслано у ваш Telegram!', 'success');
        } else {
          showToast(`Помилка Telegram API: ${data?.description || 'перевірте токен та Chat ID (натисніть /start у боті)'}`, 'error');
        }
      } catch (err) {
        showToast('Не вдалося з’єднатися з api.telegram.org.', 'error');
      }
    }

    function handleAdminCloudSyncSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const url = normalizeFirebaseUrl(fd.get('firebaseDbUrl') || '');
      state.settings.firebaseDbUrl = url;
      if (url) {
        localStorage.setItem(CLOUD_URL_KEY, url);
        saveState(true);
        syncFromCloud(false);
      } else {
        localStorage.removeItem(CLOUD_URL_KEY);
        cloudSyncStatus = 'local';
        saveState(true);
        showToast('Хмарну базу вимкнено. Увімкнено локальний режим.', 'info');
      }
      renderApp();
    }

    function handleAdminPinChangeSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const newPin = String(fd.get('newPin') || '').trim();
      if (newPin.length < 4) {
        showToast('PIN-код має містити мінімум 4 символи.', 'error');
        return;
      }
      state.settings.adminPin = newPin;
      saveState();
      e.target.reset();
      showToast('PIN-код адміністратора успішно змінено!', 'success');
    }

    /*************************************************************************
     * 16. ГОЛОВНИЙ РЕНДЕР ДОДАТКУ ТА ІНІЦІАЛІЗАЦІЯ
     *************************************************************************/
    function renderApp() {
      renderNavigation();
      const main = document.getElementById('app-main');
      if (!main) return;

      if (ui.activeTab === 'jobs') {
        main.innerHTML = renderJobsSection();
        if (ui.jobsViewMode === 'map') {
          setTimeout(initBrowseMap, 60);
        }
      } else if (ui.activeTab === 'workers') {
        main.innerHTML = renderWorkersSection();
      } else if (ui.activeTab === 'cabinet') {
        main.innerHTML = renderCabinetSection();
      } else if (ui.activeTab === 'admin') {
        main.innerHTML = renderAdminSection();
      }
    }

    window.onload = function () {
      initTelegramWebApp();

      // Якщо користувач відкрив додаток у Telegram і вже має акаунт із цим tgId — автоматичний вхід
      if (!state.currentUserId && tgWebAppUser && tgWebAppUser.id) {
        const existingTgUser = state.users.find((u) => String(u.tgId) === String(tgWebAppUser.id));
        if (existingTgUser && !existingTgUser.isBlocked) {
          state.currentUserId = existingTgUser.id;
          saveState(true);
        }
      }

      renderApp();

      // Якщо підключено хмарну базу Firebase (через налаштування або ?db=...) — синхронізуємо при запуску
      if (state.settings.firebaseDbUrl) {
        syncFromCloud(true);
      }
    };
  </script>
</body>
</html>
