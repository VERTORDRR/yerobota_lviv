  <style>
    :root {
      --tg-safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F1F5F9;

      padding-bottom: calc(74px + var(--tg-safe-bottom));

    @media (min-width: 1024px) {
      body {
        padding-bottom: 0;

    /* Приховування скролбару для горизонтальних чіпсів */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Кастомний скролбар */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {

    /* Анімації модалок та сповіщень */
    @keyframes fadeSlideUp {

        opacity: 0;
        transform: translateY(14px) scale(0.98);

        opacity: 1;
        transform: translateY(0) scale(1);

    .animate-modal {

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-toast {
      animation: toastIn 0.24s ease-out forwards;
    }

    .bottom-nav-safe {
      padding-bottom: max(0.5rem, var(--tg-safe-bottom));
    }
  </style>
</head>

  <!-- ==================== КОРІНЬ МОДАЛЬНИХ ВІКОН ==================== -->
  <div id="modal-root"></div>

  <!-- ==================== JAVASCRIPT ЛОГІКА ==================== -->
  <script>
    /*************************************************************************
     * 1. КОНСТАНТИ, ДОВІДНИКИ ЛЬВОВА ТА TELEGRAM WEBAPP SDK
     *************************************************************************/
    const STORAGE_KEY = 'pidrobitok_lviv_v5';
    const CLOUD_URL_KEY = 'pidrobitok_lviv_cloud_url';

    // Райони Львова та прилеглі населені пункти
    const LVIV_DISTRICTS = [
      { name: 'Галицький / Центр', lat: 49.8419, lng: 24.0315 },
      { name: 'Сихівський', lat: 49.7937, lng: 24.0488 },
      { name: 'Франківський', lat: 49.8145, lng: 23.9961 },
      { name: 'Шевченківський', lat: 49.8665, lng: 24.0228 },
      { name: 'Личаківський', lat: 49.8398, lng: 24.0628 },
      { name: 'Залізничний', lat: 49.8356, lng: 23.9685 },
      { name: 'Винники', lat: 49.8155, lng: 24.1332 },
      { name: 'Брюховичі', lat: 49.9035, lng: 23.9498 },
      { name: 'Сокільники', lat: 49.7764, lng: 23.9647 },
      { name: 'Зимна Вода', lat: 49.8267, lng: 23.8902 },
      { name: 'Рудне', lat: 49.8397, lng: 23.8758 },
      { name: 'Дубляни', lat: 49.8967, lng: 24.0933 },
      { name: 'Пустомити', lat: 49.7136, lng: 23.9086 },
    ];

    const JOB_CATEGORIES = [
      "Кур'єр / Доставка",
      'Будівництво / Ремонт',
      'Склад / Вантажники',
      'HoReCa / Кав\'ярні',
      'Прибирання / Клінінг',
      'Промо / Роздача',
      'Авто / Водій',
      'Події / Івенти',
      'Інше',
    ];

    const QUICK_JOB_TAGS = [
      { id: 'daily_pay', label: '💸 Виплата щодня' },
      { id: 'weekend', label: '📅 На вихідні' },
      { id: 'one_time', label: '⚡ Разова робота' },
    ];

    const WORKER_SKILL_SUGGESTIONS = [
      "Кур'єр",
      'Вантажник',
      'Бариста',
      'Прибирання',
      'Ремонт',
      'Промоутер',
      'Водій',
      'Склад',
    ];

    // Telegram WebApp API обгортка
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    let tgWebAppUser = null;

    function initTelegramWebApp() {
      if (!tg) return;
      try {
        tg.ready();
        tg.expand();
        if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#0F172A');
        if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#F1F5F9');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          tgWebAppUser = tg.initDataUnsafe.user;
        }
      } catch (err) {
        console.warn('Telegram WebApp init notice:', err);
      }
    }

    function triggerHaptic(style = 'light') {
      try {
        if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
          tg.HapticFeedback.impactOccurred(style);
        }
      } catch {
        // Ігноруємо у звичайному браузері
      }
    }

    function updateTelegramClosingConfirmation(enable) {
      try {
        if (!tg) return;
        if (enable && typeof tg.enableClosingConfirmation === 'function') {
          tg.enableClosingConfirmation();
        } else if (!enable && typeof tg.disableClosingConfirmation === 'function') {
          tg.disableClosingConfirmation();
        }
      } catch {
        // Ігноруємо
      }
    }

    /*************************************************************************
     * 2. ПОЧАТКОВИЙ ЧИСТИЙ СТАН ТА CLOUD SYNC (FIREBASE RTDB)
     *************************************************************************/
    function createCleanInitialState() {
      const urlParams = new URLSearchParams(window.location.search);
      const dbFromUrl = urlParams.get('db') || localStorage.getItem(CLOUD_URL_KEY) || '';

      return {
        users: [],
        currentUserId: null,
        jobs: [],
        applications: [],
        invitations: [],
        reviews: [],
        payments: [],
        guestSavedJobIds: [],
        userSavedJobs: {}, // { [userId]: [jobId] }
        adminAuthenticated: false,
        settings: {
          adminPin: '7777',
          monoJarEnabled: true,
          monoJarUrl: '',
          monoJarShowQr: true,
          monoCardEnabled: true,
          monoCardNumber: '',
          monoCardHolder: '',
          monoIban: '',
          freeJobsLimit: 2,
          priceExtraPost: 50,
          priceTopJob: 80,
          priceUrgentJob: 40,
          promoCodes: [
            { code: 'LVIV50', discountPercent: 50 },
            { code: 'START100', discountPercent: 100 },
          ],
          tgBotToken: '',
          tgChatId: '',
          firebaseDbUrl: normalizeFirebaseUrl(dbFromUrl),
        },
      };
    }

    function normalizeFirebaseUrl(rawUrl) {
      if (!rawUrl) return '';
      let clean = String(rawUrl).trim().replace(/\/+$/, '');
      if (clean && !clean.startsWith('http://') && !clean.startsWith('https://')) {
        clean = 'https://' + clean;
      }
      return clean;
    }

    let state = loadState();
    let cloudSyncStatus = state.settings.firebaseDbUrl ? 'connecting' : 'local';
    let cloudPushTimer = null;

    const ui = {
      activeTab: 'jobs', // 'jobs' | 'workers' | 'cabinet' | 'admin'
      jobsViewMode: 'list', // 'list' | 'map'
      jobFilters: {
        search: '',
        district: 'ALL',
        category: 'ALL',
        tag: 'ALL', // 'ALL' | 'daily_pay' | 'weekend' | 'one_time' | 'urgent' | 'saved'
        sort: 'top_newest', // 'top_newest' | 'newest' | 'pay_desc'
      },
      workerFilters: {
        search: '',
        district: 'ALL',
        onlyAvailable: false,
        sort: 'rating_desc', // 'rating_desc' | 'completed_desc' | 'newest'
      },
      cabinetSubTab: 'main',
      adminSubTab: 'overview', // 'overview' | 'payments' | 'monobank' | 'moderation' | 'telegram_sync'
      paymentFilter: 'ALL',
      userSearch: '',
      modSubFilter: 'jobs', // 'jobs' | 'users'
    };

    let browseMapInstance = null;
    let formMapInstance = null;
    let formMarkerInstance = null;
    let detailMapInstance = null;

    function loadState() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const dbFromUrl = normalizeFirebaseUrl(urlParams.get('db') || '');
        if (dbFromUrl) {
          localStorage.setItem(CLOUD_URL_KEY, dbFromUrl);
        }

        const raw = localStorage.getItem(STORAGE_KEY);
        const base = createCleanInitialState();
        if (!raw) return base;

        const parsed = JSON.parse(raw);
        const merged = {
          ...base,
          ...parsed,
          settings: {
            ...base.settings,
            ...(parsed.settings || {}),
          },
        };
        if (dbFromUrl) {
          merged.settings.firebaseDbUrl = dbFromUrl;
        }
        return merged;
      } catch (err) {
        console.error('Помилка читання localStorage:', err);
        return createCleanInitialState();
      }
    }

    function saveState(skipCloudPush = false) {
      try {
        if (state.settings.firebaseDbUrl) {
          localStorage.setItem(CLOUD_URL_KEY, state.settings.firebaseDbUrl);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Помилка запису localStorage:', err);
        showToast('Не вдалося зберегти дані у пам’ять браузера.', 'error');
      }

      if (!skipCloudPush && state.settings.firebaseDbUrl) {
        scheduleCloudPush();
      }
    }

    function scheduleCloudPush() {
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(() => {
        pushToCloud(true);
      }, 650);
    }

    async function pushToCloud(silent = false) {
      const dbUrl = normalizeFirebaseUrl(state.settings.firebaseDbUrl);
      if (!dbUrl) {
        cloudSyncStatus = 'local';
        updateCloudBadge();
        return;
      }

      try {
        cloudSyncStatus = 'syncing';
        updateCloudBadge();

        // Зберігаємо спільні дані платформи (без локальних прапорців сесії currentUserId/adminAuthenticated)
        const sharedPayload = {
          users: state.users,
          jobs: state.jobs,
          applications: state.applications,
          invitations: state.invitations,
          reviews: state.reviews,
          payments: state.payments,
          userSavedJobs: state.userSavedJobs,
          settings: {
            ...state.settings,
          },
          updatedAt: Date.now(),
        };

        const res = await fetch(`${dbUrl}/pidrobitok_lviv_v5.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sharedPayload),
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);
        cloudSyncStatus = 'synced';
        updateCloudBadge();
        if (!silent) showToast('☁️ Дані успішно синхронізовано з хмарою!', 'success');
      } catch (err) {
        console.error('Cloud push error:', err);
        cloudSyncStatus = 'error';
        updateCloudBadge();
        if (!silent) showToast('Помилка синхронізації з Firebase. Перевірте URL бази.', 'error');
      }
    }

    async function syncFromCloud(silent = false) {
      const dbUrl = normalizeFirebaseUrl(state.settings.firebaseDbUrl);
      if (!dbUrl) {
        cloudSyncStatus = 'local';
        updateCloudBadge();
        return;
      }

      try {
        cloudSyncStatus = 'syncing';
        updateCloudBadge();

        const res = await fetch(`${dbUrl}/pidrobitok_lviv_v5.json`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();

        if (remote && typeof remote === 'object') {
          state.users = Array.isArray(remote.users) ? remote.users : state.users;
          state.jobs = Array.isArray(remote.jobs) ? remote.jobs : state.jobs;
          state.applications = Array.isArray(remote.applications) ? remote.applications : state.applications;
          state.invitations = Array.isArray(remote.invitations) ? remote.invitations : state.invitations;
          state.reviews = Array.isArray(remote.reviews) ? remote.reviews : state.reviews;
          state.payments = Array.isArray(remote.payments) ? remote.payments : state.payments;
          state.userSavedJobs = remote.userSavedJobs || state.userSavedJobs;
          if (remote.settings) {
            state.settings = {
              ...state.settings,
              ...remote.settings,
              firebaseDbUrl: dbUrl,
            };
          }
          // Якщо користувач відкрив у Telegram і його акаунт вже є в хмарі — підтягуємо сесію
          if (!state.currentUserId && tgWebAppUser && tgWebAppUser.id) {
            const matched = state.users.find((u) => String(u.tgId) === String(tgWebAppUser.id));
            if (matched && !matched.isBlocked) {
              state.currentUserId = matched.id;
            }
          }
          saveState(true);
        } else {
          // Якщо хмарна база ще порожня — ініціалізуємо її поточним станом
          await pushToCloud(true);
        }

        cloudSyncStatus = 'synced';
        updateCloudBadge();
        renderApp();
        if (!silent) showToast('☁️ Дані оновлено з хмарної бази!', 'success');
      } catch (err) {
        console.error('Cloud fetch error:', err);
        cloudSyncStatus = 'error';
        updateCloudBadge();
        if (!silent) showToast('Не вдалося завантажити дані з Firebase. Перевірте правила доступу (.read/.write: true).', 'error');
      }
    }

    function updateCloudBadge() {
      const badge = document.getElementById('cloud-status-badge');
      if (!badge) return;
      if (!state.settings.firebaseDbUrl) {
        badge.className = 'hidden sm:inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-white/10 text-slate-300';
        badge.textContent = '💾 Локально';
      } else if (cloudSyncStatus === 'synced') {
        badge.className = 'hidden sm:inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        badge.textContent = '☁️ Хмара';
      } else if (cloudSyncStatus === 'error') {
        badge.className = 'hidden sm:inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-300';
        badge.textContent = '⚠️ Помилка хмари';
      } else {
        badge.className = 'hidden sm:inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300';
        badge.textContent = '🔄 Синхронізація...';
      }
    }

    /*************************************************************************
     * 3. УТИЛІТИ (БЕЗПЕКА XSS, КОПІЮВАННЯ, TOAST, КОД ЗАМОВЛЕННЯ, TELEGRAM LINKS)
     *************************************************************************/
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
    }

    function generateUniqueOrderCode() {
      let code = '';
      let attempts = 0;
      do {
        const num = Math.floor(1000 + Math.random() * 9000);
        code = `LV-${num}`;
        attempts++;
      } while (state.payments.some((p) => p.orderCode === code) && attempts < 120);
      return code;
    }

    function formatDate(ts) {
      if (!ts) return '';
      try {
        return new Date(ts).toLocaleString('uk-UA', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      } catch {
        return '';
      }
    }

    function getCurrentUser() {
      if (!state.currentUserId) return null;
      const user = state.users.find((u) => u.id === state.currentUserId) || null;
      if (user && user.isBlocked) {
        state.currentUserId = null;
        return null;
      }
      return user;
    }

    function getUserById(id) {
      return state.users.find((u) => u.id === id) || null;
    }

    function getDistrictCoords(districtName) {
      const found = LVIV_DISTRICTS.find((d) => d.name === districtName);
      return found ? { lat: found.lat, lng: found.lng } : { lat: 49.8419, lng: 24.0315 };
    }

    // Формування прямого посилання https://t.me/username для чату в 1 клік
    function getTelegramDirectUrl(telegramHandle) {
      if (!telegramHandle) return null;
      const clean = String(telegramHandle)
        .trim()
        .replace(/^https?:\/\/(t\.me|telegram\.me)\//i, '')
        .replace(/^@+/, '')
        .replace(/[^a-zA-Z0-9_]/g, '');
      if (!clean) return null;
      return `https://t.me/${clean}`;
    }

    function formatTelegramDisplay(telegramHandle) {
      if (!telegramHandle) return '';
      const clean = String(telegramHandle)
        .trim()
        .replace(/^https?:\/\/(t\.me|telegram\.me)\//i, '')
        .replace(/^@+/, '');
      return clean ? `@${clean}` : '';
    }

    // Надійне копіювання тексту через execCommand (сумісне з iframe та Telegram WebApp)
    function copyToClipboard(text, message = 'Скопійовано в буфер обміну!') {
      triggerHaptic('light');
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (ok) {
          showToast(message, 'success');
        } else {
          showToast('Не вдалося скопіювати автоматично. Виділіть текст вручну.', 'warning');
        }
      } catch (err) {
        console.error('Copy error:', err);
        showToast('Помилка копіювання.', 'error');
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-400 text-slate-950 border-amber-300',
        info: 'bg-[#0F172A] text-white border-slate-700',
      };

      const icons = {
        success: '✅',
        error: '⚠️',
        warning: '💡',
        info: 'ℹ️',
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl shadow-xl border text-xs sm:text-sm font-semibold animate-toast ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="text-base leading-none mt-0.5">${icons[type] || icons.info}</span>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        toast.style.transition = 'all 0.24s ease';
        setTimeout(() => toast.remove(), 250);
      }, 3600);
    }

    function showConfirmModal({ title, message, confirmText = 'Підтвердити', confirmClass = 'bg-rose-600 hover:bg-rose-700 text-white', onConfirm }) {
      const root = document.getElementById('modal-root');
      const id = generateId('confirm');
      const wrapper = document.createElement('div');
      wrapper.id = id;
      wrapper.className = 'fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/65 backdrop-blur-sm';
      wrapper.innerHTML = `
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 animate-modal">
          <h3 class="text-lg font-extrabold text-slate-900 mb-2">${escapeHtml(title)}</h3>
          <p class="text-sm text-slate-600 mb-6 leading-relaxed">${escapeHtml(message)}</p>
          <div class="flex items-center justify-end gap-2.5">
            <button type="button" id="${id}-cancel" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs sm:text-sm font-bold hover:bg-slate-50 transition">
              Скасувати
            </button>
            <button type="button" id="${id}-ok" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold shadow-sm transition ${confirmClass}">
              ${escapeHtml(confirmText)}
            </button>
          </div>
        </div>
      `;
      root.appendChild(wrapper);
      updateTelegramClosingConfirmation(true);

      const close = () => {
        wrapper.remove();
        if (!root.children.length) updateTelegramClosingConfirmation(false);
      };
      document.getElementById(`${id}-cancel`).onclick = close;
      wrapper.addEventListener('click', (e) => {
        if (e.target === wrapper) close();
      });
      document.getElementById(`${id}-ok`).onclick = () => {
        triggerHaptic('medium');
        close();
        if (typeof onConfirm === 'function') onConfirm();
      };
    }

    function closeAllModals() {
      const root = document.getElementById('modal-root');
      if (root) root.innerHTML = '';
      if (formMapInstance) {
        formMapInstance.remove();
        formMapInstance = null;
        formMarkerInstance = null;
      }
      if (detailMapInstance) {
        detailMapInstance.remove();
        detailMapInstance = null;
      }
      updateTelegramClosingConfirmation(false);

    /*************************************************************************
     * 4. РЕПУТАЦІЯ, ЛІЧИЛЬНИК ВИКОНАНИХ ЗАВДАНЬ ТА ЗБЕРЕЖЕНІ ВАКАНСІЇ
     *************************************************************************/
    function getUserStats(userId) {
      const userReviews = state.reviews.filter((r) => r.toUserId === userId);
      const count = userReviews.length;
      const avg =
        count > 0
          ? (userReviews.reduce((acc, r) => acc + Number(r.rating || 0), 0) / count).toFixed(1)
          : null;

      // Підрахунок виконаних завдань (як для виконавця, так і для роботодавця)
      const completedApps = state.applications.filter((a) => {
        if (a.status !== 'completed') return false;
        if (a.workerId === userId) return true;
        const job = state.jobs.find((j) => j.id === a.jobId);
        return job && job.employerId === userId;
      }).length;

      const completedInvites = state.invitations.filter(
        (i) => i.status === 'completed' && (i.workerId === userId || i.employerId === userId)
      ).length;

      const completedTasks = completedApps + completedInvites;

      return {
        avg,
        count,
        completedTasks,
        label: avg ? `⭐ ${avg}` : 'Новачок',
      };
    }

    function getSavedJobIds() {
      const user = getCurrentUser();
      if (user) {
        return state.userSavedJobs[user.id] || [];
      }
      return state.guestSavedJobIds || [];
    }

    function toggleSaveJob(jobId) {
      triggerHaptic('light');
      const user = getCurrentUser();
      if (user) {
        const list = state.userSavedJobs[user.id] || [];
        if (list.includes(jobId)) {
          state.userSavedJobs[user.id] = list.filter((id) => id !== jobId);
          showToast('Видалено зі збережених', 'info');
        } else {
          state.userSavedJobs[user.id] = [...list, jobId];
          showToast('Вакансію збережено!', 'success');
        }
      } else {
        if (state.guestSavedJobIds.includes(jobId)) {
          state.guestSavedJobIds = state.guestSavedJobIds.filter((id) => id !== jobId);
          showToast('Видалено зі збережених', 'info');
        } else {
          state.guestSavedJobIds.push(jobId);
          showToast('Вакансію збережено!', 'success');
        }
      }
      saveState();
      renderApp();
    }

                  required

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">

                <label class="block text-xs font-bold text-slate-700 mb-1">Email (ваш логін) *</label>

                  name="email"
                  required

                <input

                  name="telegram"
                  value="${escapeHtml(tgUsername)}"

                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 outline-none text-sm"

                <label class="block text-xs font-semibold text-slate-600 mb-1">Viber (опційно)</label>

                <span class="text-xs font-extrabold uppercase tracking-wider text-emerald-900">
                  📋 Анкета в каталог «👷 Виконавці»

                <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500 text-slate-950">
                  🟢 Вільний
                </span>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Спеціалізація / що вмію робити *</label>
                <input
                  type="text"
                  id="reg-worker-specialty"
                  name="specialty"
                  ${preselectedRole === 'worker' ? 'required' : ''}
                  placeholder="Напр.: Кур'єр, Вантажник, Бариста, Прибирання"

                </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Основний район у Львові *</label>
                  <select
                    name="district"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-emerald-300 bg-white focus:border-emerald-600 outline-none text-sm"
                  >
                    ${districtOptions}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Бажана оплата *</label>
                  <input
                    type="text"
                    id="reg-worker-rate"

                    ${preselectedRole === 'worker' ? 'required' : ''}
                    placeholder="Напр.: 250 грн/год або 1200 грн/зміна"

                  />

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Коротко про себе та досвід</label>
                <textarea
                  name="bio"
                  rows="2"
                  placeholder="Пунктуальний, без шкідливих звичок, готовий виїхати в будь-який район Львова..."
                  class="w-full px-3.5 py-2 rounded-xl border border-emerald-300 bg-white focus:border-emerald-600 outline-none text-sm"
                ></textarea>
              </div>

              <label class="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" name="isAvailable" checked class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500" />
                <span class="text-xs font-bold text-emerald-950">🟢 Вільний до підробітку (показувати роботодавцям одразу)</span>
              </label>

            <button
              type="submit"
              class="w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm shadow-md transition"
            >
              Створити акаунт і увійти
            </button>
          </form>
        </div>
      `;

      root.appendChild(modal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeAllModals();
      });
    }

    function switchAuthTab(mode) {
      triggerHaptic('light');
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const btnLogin = document.getElementById('tab-btn-login');
      const btnReg = document.getElementById('tab-btn-register');
      if (!loginForm || !regForm) return;

      if (mode === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        btnLogin.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition bg-white text-slate-900 shadow-sm';
        btnReg.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition text-slate-500 hover:text-slate-900';
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        btnReg.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition bg-white text-slate-900 shadow-sm';
        btnLogin.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition text-slate-500 hover:text-slate-900';
      }
    }

    function toggleRegisterRoleFields(role) {
      triggerHaptic('light');
      const box = document.getElementById('register-worker-fields');
      const specInput = document.getElementById('reg-worker-specialty');
      const rateInput = document.getElementById('reg-worker-rate');
      if (!box) return;

      if (role === 'worker') {
        box.classList.remove('hidden');
        if (specInput) specInput.required = true;
        if (rateInput) rateInput.required = true;
      } else {
        box.classList.add('hidden');
        if (specInput) specInput.required = false;
        if (rateInput) rateInput.required = false;
      }
    }

    function appendSkillSuggestion(skill) {
      triggerHaptic('light');
      const input = document.getElementById('reg-worker-specialty');
      if (!input) return;
      const current = input.value.trim();
      if (!current) {
        input.value = skill;
      } else if (!current.toLowerCase().includes(skill.toLowerCase())) {
        input.value = `${current}, ${skill}`;
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const iden = String(fd.get('identifier') || '').trim().toLowerCase();
      const password = String(fd.get('password') || '');

      const user = state.users.find(
        (u) =>
          (u.email.toLowerCase() === iden || u.phone.replace(/\s+/g, '') === iden.replace(/\s+/g, '')) &&
          u.password === password
      );

      if (!user) {
        showToast('Невірний Email/телефон або пароль.', 'error');
        return;
      }
      if (user.isBlocked) {
        showToast('Ваш акаунт тимчасово заблоковано адміністратором.', 'error');
        return;
      }

      // Прив'язуємо Telegram ID, якщо користувач увійшов через Telegram Mini App
      if (tgWebAppUser && tgWebAppUser.id) {
        user.tgId = tgWebAppUser.id;
        if (!user.telegram && tgWebAppUser.username) {
          user.telegram = `@${tgWebAppUser.username}`;
        }
      }

      state.currentUserId = user.id;
      saveState();
      closeAllModals();
      triggerHaptic('medium');
      showToast(`Вітаємо, ${user.name}!`, 'success');
      renderApp();
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const role = String(fd.get('role') || 'worker');
      const name = String(fd.get('name') || '').trim();
      const phone = String(fd.get('phone') || '').trim();
      const email = String(fd.get('email') || '').trim().toLowerCase();
      const password = String(fd.get('password') || '');
      const telegram = String(fd.get('telegram') || '').trim();
      const viber = String(fd.get('viber') || '').trim();

      if (!name || !phone || !email || password.length < 4) {
        showToast('Заповніть усі обов’язкові поля (пароль мінімум 4 символи).', 'error');
        return;
      }

      if (state.users.some((u) => u.email.toLowerCase() === email)) {
        showToast('Користувач із таким Email вже зареєстрований.', 'error');
        return;
      }

      let workerProfile = null;
      if (role === 'worker') {
        const specialty = String(fd.get('specialty') || '').trim();
        const district = String(fd.get('district') || LVIV_DISTRICTS[0].name);
        const rate = String(fd.get('rate') || '').trim();
        const bio = String(fd.get('bio') || '').trim();
        const isAvailable = fd.get('isAvailable') === 'on';

        if (!specialty || !rate) {
          showToast('Для анкети виконавця вкажіть спеціалізацію та бажану оплату.', 'error');
          return;
        }

        workerProfile = {
          specialty,
          district,
          rate,
          bio,
          isAvailable,
          isHiddenByAdmin: false,
        };
      }

      const newUser = {
        id: generateId('usr'),
        tgId: tgWebAppUser && tgWebAppUser.id ? tgWebAppUser.id : null,
        role,
        name,
        email,
        password,
        phone,
        telegram,
        viber,
        bonusFreeSlots: 0,
        isBlocked: false,
        createdAt: Date.now(),
        workerProfile,
      };

      state.users.push(newUser);
      state.currentUserId = newUser.id;
      saveState();
      closeAllModals();
      triggerHaptic('medium');

      if (role === 'worker') {
        showToast('Реєстрація успішна! Ваша анкета вже з’явилася у каталозі «👷 Виконавці».', 'success');
        navigateTo('workers');
      } else {
        showToast('Акаунт роботодавця створено! Тепер ви можете публікувати пропозиції роботи.', 'success');
        navigateTo('cabinet');
      }
    }

    function logoutUser() {
      triggerHaptic('light');
      state.currentUserId = null;
      saveState();
      showToast('Ви вийшли з акаунту.', 'info');
      renderApp();
    }

    /*************************************************************************
     * 7. ВКЛАДКА 1: «🔍 ВАКАНСІЇ» (СПИСОК + ШВИДКІ ЧІПСИ + КАРТА ЛЬВОВА)
     *************************************************************************/
    function renderJobsSection() {
      const currentUser = getCurrentUser();
      const isEmployer = currentUser && currentUser.role === 'employer';
      const savedIds = getSavedJobIds();

      let jobs = state.jobs.filter((j) => j.status === 'active' && !j.isHiddenByAdmin);

      if (ui.jobFilters.district !== 'ALL') {
        jobs = jobs.filter((j) => j.district === ui.jobFilters.district);
      }
      if (ui.jobFilters.category !== 'ALL') {
        jobs = jobs.filter((j) => j.category === ui.jobFilters.category);
      }
      if (ui.jobFilters.tag === 'urgent') {
        jobs = jobs.filter((j) => j.isUrgent);
      } else if (ui.jobFilters.tag === 'saved') {
        jobs = jobs.filter((j) => savedIds.includes(j.id));
      } else if (ui.jobFilters.tag !== 'ALL') {
        jobs = jobs.filter((j) => Array.isArray(j.tags) && j.tags.includes(ui.jobFilters.tag));
      }

      if (ui.jobFilters.search.trim()) {
        const q = ui.jobFilters.search.trim().toLowerCase();
        jobs = jobs.filter(
          (j) =>
            j.title.toLowerCase().includes(q) ||
            j.description.toLowerCase().includes(q) ||
            j.district.toLowerCase().includes(q) ||
            (j.address && j.address.toLowerCase().includes(q))
        );
      }

      jobs.sort((a, b) => {
        if (ui.jobFilters.sort === 'top_newest') {
          if (a.isTop !== b.isTop) return a.isTop ? -1 : 1;
          return b.createdAt - a.createdAt;
        }
        if (ui.jobFilters.sort === 'pay_desc') {
          const numA = parseFloat(String(a.pay).replace(/[^\d.]/g, '')) || 0;
          const numB = parseFloat(String(b.pay).replace(/[^\d.]/g, '')) || 0;
          if (numB !== numA) return numB - numA;
        }
        return b.createdAt - a.createdAt;
      });

      const districtOptions = LVIV_DISTRICTS.map(
        (d) =>
          `<option value="${escapeHtml(d.name)}" ${
            ui.jobFilters.district === d.name ? 'selected' : ''
          }>${escapeHtml(d.name)}</option>`
      ).join('');

      const categoryOptions = JOB_CATEGORIES.map(
        (c) =>
          `<option value="${escapeHtml(c)}" ${
            ui.jobFilters.category === c ? 'selected' : ''
          }>${escapeHtml(c)}</option>`
      ).join('');

      const quickChips = [
        { id: 'ALL', label: 'Усі пропозиції' },
        { id: 'daily_pay', label: '💸 Виплата щодня' },
        { id: 'weekend', label: '📅 На вихідні' },
        { id: 'one_time', label: '⚡ Разова робота' },
        { id: 'urgent', label: '🔥 Терміново' },
        { id: 'saved', label: `❤️ Збережені (${savedIds.length})` },
      ];

      let contentHtml = '';
      if (jobs.length === 0) {
        const hasAnyJobsInSystem = state.jobs.some((j) => j.status === 'active' && !j.isHiddenByAdmin);
        contentHtml = `
          <div class="bg-white rounded-3xl border border-slate-200 p-8 sm:p-12 text-center shadow-sm">
            <div class="w-16 h-16 rounded-2xl bg-slate-100 text-3xl flex items-center justify-center mx-auto mb-4">
              🔍
            </div>
            <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 mb-2">
              ${hasAnyJobsInSystem ? 'За вибраними фільтрами вакансій не знайдено' : 'Стрічка вакансій Львова поки порожня'}
            </h3>
            <p class="text-xs sm:text-sm text-slate-500 max-w-md mx-auto mb-6 leading-relaxed">
              ${
                hasAnyJobsInSystem
                  ? 'Спробуйте змінити район Львова, категорію або очистити швидкі фільтри.'
                  : 'Будьте першими! Роботодавці можуть опублікувати вакансію з точкою на карті Львова, а виконавці — додати свою анкету до каталогу.'
              }
            </p>
            <div class="flex flex-wrap items-center justify-center gap-2.5">
              ${
                hasAnyJobsInSystem
                  ? `<button type="button" onclick="resetJobFilters()" class="px-5 py-2.5 rounded-xl bg-[#0F172A] text-white text-xs sm:text-sm font-bold hover:bg-slate-800 transition">
                      Скинути фільтри
                    </button>`
                  : isEmployer
                  ? `<button type="button" onclick="openJobFormModal()" class="px-5 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs sm:text-sm font-extrabold shadow-sm transition">
                      + Виставити першу пропозицію
                    </button>`
                  : !currentUser
                  ? `<button type="button" onclick="openAuthModal('register', 'employer')" class="px-4 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs sm:text-sm font-extrabold shadow-sm transition">
                      💼 Зареєструватися як роботодавець
                    </button>
                    <button type="button" onclick="openAuthModal('register', 'worker')" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs sm:text-sm font-extrabold shadow-sm transition">
                      👷 Додати анкету виконавця
                    </button>`
                  : `<button type="button" onclick="navigateTo('cabinet')" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs sm:text-sm font-extrabold shadow-sm transition">
                      👷 Керувати моєю анкетою
                    </button>`
              }
            </div>
          </div>
        `;
      } else if (ui.jobsViewMode === 'map') {
        contentHtml = `
          <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="p-3.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-600">
              <span>🗺️ Активних пропозицій на карті Львова: <strong class="text-slate-900">${jobs.length}</strong></span>
              <button type="button" onclick="setJobsViewMode('list')" class="text-emerald-600 font-extrabold hover:underline">
                Повернутися до списку →
              </button>
            </div>
            <div id="lviv-browse-map" class="w-full h-[440px] sm:h-[540px]"></div>
          </div>
        `;
      } else {
        contentHtml = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
            ${jobs.map((job) => renderJobCard(job, savedIds.includes(job.id))).join('')}
          </div>
        `;
      }

      return `
        <section class="space-y-4 sm:space-y-5">
          <!-- Компактний Hero-банер у кольорах бренду -->
          <div class="rounded-3xl bg-[#0F172A] text-white p-5 sm:p-7 shadow-lg relative overflow-hidden border border-slate-800">
            <div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div>
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 text-amber-400 text-xs font-bold mb-2">
                  <span>📍 Львів та передмістя</span>
                  <span>•</span>
                  <span>Прямі контакти</span>
                </div>
                <h1 class="text-xl sm:text-3xl font-black tracking-tight">
                  Швидкий підробіток у місті Лева
                </h1>
                <p class="text-xs sm:text-sm text-slate-300 mt-1 max-w-2xl">
                  Шукайте вакансії за районом або прямо на карті Львова. Взаємний рейтинг роботодавців та виконавців.
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2 shrink-0">
                ${
                  isEmployer
                    ? `<button type="button" onclick="openJobFormModal()" class="px-5 py-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs sm:text-sm shadow-md transition">
                        + Виставити пропозицію
                      </button>`
                    : !currentUser
                    ? `<button type="button" onclick="openAuthModal('register', 'worker')" class="px-4 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs sm:text-sm transition">
                        👷 Шукаю підробіток
                      </button>
                      <button type="button" onclick="openAuthModal('register', 'employer')" class="px-4 py-2.5 rounded-2xl bg-white/15 hover:bg-white/25 text-white font-bold text-xs sm:text-sm transition">
                        💼 Пропоную роботу
                      </button>`
                    : ''
                }
              </div>
            </div>
          </div>

          <!-- Панель фільтрів, швидких чіпсів та перемикача Список / Карта -->
          <div class="bg-white rounded-3xl border border-slate-200 p-3.5 sm:p-4 shadow-sm space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
              <input
                type="text"
                value="${escapeHtml(ui.jobFilters.search)}"
                oninput="updateJobFilter('search', this.value)"
                placeholder="🔍 Пошук роботи, адреси..."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm"
              />
              <select
                onchange="updateJobFilter('district', this.value)"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm bg-white"
              >
                <option value="ALL">📍 Усі райони Львова та передмістя</option>
                ${districtOptions}
              </select>

    function initBrowseMap() {
      const container = document.getElementById('lviv-browse-map');
      if (!container || typeof L === 'undefined') return;

      if (browseMapInstance) {
        browseMapInstance.remove();
        browseMapInstance = null;
      }

      let jobs = state.jobs.filter((j) => j.status === 'active' && !j.isHiddenByAdmin);
      if (ui.jobFilters.district !== 'ALL') {
        jobs = jobs.filter((j) => j.district === ui.jobFilters.district);
      }
      if (ui.jobFilters.category !== 'ALL') {
        jobs = jobs.filter((j) => j.category === ui.jobFilters.category);
      }
      if (ui.jobFilters.tag === 'urgent') {
        jobs = jobs.filter((j) => j.isUrgent);
      } else if (ui.jobFilters.tag === 'saved') {
        const savedIds = getSavedJobIds();
        jobs = jobs.filter((j) => savedIds.includes(j.id));
      } else if (ui.jobFilters.tag !== 'ALL') {
        jobs = jobs.filter((j) => Array.isArray(j.tags) && j.tags.includes(ui.jobFilters.tag));
      }

      browseMapInstance = L.map('lviv-browse-map').setView([49.8397, 24.0297], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
      }).addTo(browseMapInstance);

      const bounds = [];
      jobs.forEach((job) => {
        const lat = Number(job.lat) || 49.8397;
        const lng = Number(job.lng) || 24.0297;
        bounds.push([lat, lng]);

        const marker = L.marker([lat, lng]).addTo(browseMapInstance);
        marker.bindPopup(`
          <div style="min-width:190px;font-family:Inter,sans-serif;">
            <div style="font-weight:800;font-size:13px;color:#0f172a;margin-bottom:4px;">${escapeHtml(job.title)}</div>
            <div style="font-weight:700;font-size:12px;color:#059669;margin-bottom:4px;">💰 ${escapeHtml(job.pay)}</div>
            <div style="font-size:11px;color:#475569;margin-bottom:8px;">📍 ${escapeHtml(job.district)}</div>
            <button
              type="button"
              onclick="openJobDetailModal('${job.id}')"
              style="width:100%;padding:6px 10px;background:#0F172A;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;"
            >
              Відкрити вакансію
            </button>
          </div>
        `);
      });

      if (bounds.length > 0) {
        browseMapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }

      setTimeout(() => {
        if (browseMapInstance) browseMapInstance.invalidateSize();
      }, 150);
    }

    function getAppStatusLabel(status) {
      if (status === 'accepted') return '✅ Вас обрано';
      if (status === 'completed') return '🎉 Виконано';
      if (status === 'rejected') return '❌ Відхилено';
      return '⏳ На розгляді';
    }

    function handleApplyJobSubmit(e, jobId) {
      e.preventDefault();
      const currentUser = getCurrentUser();
      if (!currentUser || currentUser.role !== 'worker') return;

      const fd = new FormData(e.target);
      const message = String(fd.get('message') || '').trim();
      if (!message) return;

      if (state.applications.some((a) => a.jobId === jobId && a.workerId === currentUser.id)) {
        showToast('Ви вже надсилали відгук на цю пропозицію.', 'info');
        return;
      }

      state.applications.push({
        id: generateId('app'),
        jobId,
        workerId: currentUser.id,
        message,
        status: 'pending',
        createdAt: Date.now(),
      });
      saveState();
      closeAllModals();
      triggerHaptic('medium');
      showToast('Ваш відгук надіслано роботодавцю!', 'success');
      renderApp();
    }

    /*************************************************************************
     * 9. ВКЛАДКА 2: «👷 ВИКОНАВЦІ» (КАТАЛОГ ДЛЯ РОБОТОДАВЦІВ)
     *************************************************************************/
    function renderWorkersSection() {
      const currentUser = getCurrentUser();
      let workers = state.users.filter(
        (u) => u.role === 'worker' && u.workerProfile && !u.workerProfile.isHiddenByAdmin && !u.isBlocked
      );

      if (ui.workerFilters.district !== 'ALL') {
        workers = workers.filter((w) => w.workerProfile.district === ui.workerFilters.district);
      }
      if (ui.workerFilters.onlyAvailable) {
        workers = workers.filter((w) => w.workerProfile.isAvailable);
      }
      if (ui.workerFilters.search.trim()) {
        const q = ui.workerFilters.search.trim().toLowerCase();
        workers = workers.filter(
          (w) =>
            w.name.toLowerCase().includes(q) ||
            w.workerProfile.specialty.toLowerCase().includes(q) ||
            (w.workerProfile.bio && w.workerProfile.bio.toLowerCase().includes(q)) ||
            w.workerProfile.district.toLowerCase().includes(q)
        );
      }

      workers.sort((a, b) => {
        if (ui.workerFilters.sort === 'rating_desc') {
          const repA = Number(getUserStats(a.id).avg || 0);
          const repB = Number(getUserStats(b.id).avg || 0);
          if (repB !== repA) return repB - repA;
        } else if (ui.workerFilters.sort === 'completed_desc') {
          const cA = getUserStats(a.id).completedTasks;
          const cB = getUserStats(b.id).completedTasks;
          if (cB !== cA) return cB - cA;
        }
        return b.createdAt - a.createdAt;
      });

      const districtOptions = LVIV_DISTRICTS.map(
        (d) =>
          `<option value="${escapeHtml(d.name)}" ${
            ui.workerFilters.district === d.name ? 'selected' : ''
          }>${escapeHtml(d.name)}</option>`
      ).join('');

      let contentHtml = '';
      if (workers.length === 0) {
        const hasAnyWorkers = state.users.some(
          (u) => u.role === 'worker' && u.workerProfile && !u.workerProfile.isHiddenByAdmin && !u.isBlocked
        );
        contentHtml = `
          <div class="bg-white rounded-3xl border border-slate-200 p-8 sm:p-12 text-center shadow-sm">
            <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-3xl flex items-center justify-center mx-auto mb-4">
              👷
            </div>
            <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 mb-2">
              ${hasAnyWorkers ? 'За вибраними фільтрами виконавців не знайдено' : 'Каталог виконавців Львова поки порожній'}
            </h3>
            <p class="text-xs sm:text-sm text-slate-500 max-w-md mx-auto mb-6 leading-relaxed">
              ${
                hasAnyWorkers
                  ? 'Спробуйте обрати інший район Львова або зняти галочку «🟢 Тільки вільні».'
                  : 'Зареєструйтеся як виконавець, вкажіть спеціалізацію, район Львова та контакти — ваша картка одразу з’явиться тут!'
              }
            </p>
            <div class="flex flex-wrap items-center justify-center gap-2.5">
              ${
                hasAnyWorkers
                  ? `<button type="button" onclick="resetWorkerFilters()" class="px-5 py-2.5 rounded-xl bg-[#0F172A] text-white text-xs sm:text-sm font-bold hover:bg-slate-800 transition">
                      Скинути фільтри
                    </button>`
                  : !currentUser
                  ? `<button type="button" onclick="openAuthModal('register', 'worker')" class="px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs sm:text-sm font-extrabold shadow-sm transition">
                      👷 Зареєструватися як виконавець
                    </button>`
                  : `<button type="button" onclick="navigateTo('jobs')" class="px-5 py-3 rounded-xl bg-[#0F172A] text-white text-xs sm:text-sm font-bold transition">
                      🔍 Переглянути вакансії
                    </button>`
              }
            </div>
          </div>
        `;
      } else {
        contentHtml = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
            ${workers.map((w) => renderWorkerCard(w)).join('')}
          </div>
        `;
      }

      return `
        <section class="space-y-4 sm:space-y-5">
          <div class="rounded-3xl bg-[#0F172A] text-white p-5 sm:p-7 shadow-lg border border-slate-800">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div>
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold mb-2">
                  <span>👷 Перевірені помічники та спеціалісти Львова</span>
                </div>
                <h1 class="text-xl sm:text-3xl font-black tracking-tight">
                  База виконавців у Львові та передмістях
                </h1>
                <p class="text-xs sm:text-sm text-slate-300 mt-1 max-w-2xl">
                  Обирайте вільних виконавців за спеціалізацією та районом, дивіться рейтинг, кількість виконаних завдань і пишіть у Telegram або телефонуйте в 1 клік.
                </p>
              </div>
              ${
                !currentUser
                  ? `<button type="button" onclick="openAuthModal('register', 'worker')" class="shrink-0 px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs sm:text-sm shadow-md transition">
                      + Додати свою анкету виконавця
                    </button>`
                  : ''
              }
            </div>
          </div>

          <!-- Панель фільтрів виконавців -->
          <div class="bg-white rounded-3xl border border-slate-200 p-3.5 sm:p-4 shadow-sm space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
              <input
                type="text"
                value="${escapeHtml(ui.workerFilters.search)}"
                oninput="updateWorkerFilter('search', this.value)"
                placeholder="🔍 Спеціалізація, ім'я..."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm"
              />
              <select
                onchange="updateWorkerFilter('district', this.value)"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm bg-white"
              >
                <option value="ALL">📍 Усі райони Львова та передмістя</option>
                ${districtOptions}
              </select>
              <select
                onchange="updateWorkerFilter('sort', this.value)"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm bg-white"
              >
                <option value="rating_desc" ${ui.workerFilters.sort === 'rating_desc' ? 'selected' : ''}>Сортування: ⭐ За рейтингом</option>
                <option value="completed_desc" ${ui.workerFilters.sort === 'completed_desc' ? 'selected' : ''}>Сортування: ✅ Найбільше виконаних</option>
                <option value="newest" ${ui.workerFilters.sort === 'newest' ? 'selected' : ''}>Сортування: Нові анкети</option>
              </select>
              <label class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer select-none">
                <input
                  type="checkbox"
                  ${ui.workerFilters.onlyAvailable ? 'checked' : ''}
                  onchange="updateWorkerFilter('onlyAvailable', this.checked)"
                  class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500"
                />
                <span class="text-xs font-extrabold text-slate-800">🟢 Тільки вільні</span>
              </label>
            </div>
            <div class="text-xs text-slate-500">
              Знайдено виконавців: <strong class="text-slate-900">${workers.length}</strong>
            </div>
          </div>

          ${contentHtml}
        </section>
      `;
    }

    function renderWorkerCard(worker) {
      const wp = worker.workerProfile;
      const stats = getUserStats(worker.id);
      const tgChatUrl = getTelegramDirectUrl(worker.telegram);

      return `
        <article class="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <!-- Статус зайнятості та репутація -->
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-extrabold ${
                wp.isAvailable
                  ? 'bg-emerald-100 text-emerald-800'
                  : 'bg-amber-100 text-amber-800'
              }">
                ${wp.isAvailable ? '🟢 Вільний' : '🟡 Зайнятий'}
              </span>
              <button
                type="button"
                onclick="openReputationModal('${worker.id}')"
                class="px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-950 text-xs font-extrabold transition"
              >
                ${stats.label} (${stats.count})
              </button>
            </div>

            <!-- Ім'я та спеціалізація -->
            <div class="flex items-center gap-3 mb-3">
              <div class="w-11 h-11 rounded-2xl bg-[#0F172A] text-emerald-400 font-black flex items-center justify-center text-base shrink-0">
                ${escapeHtml(worker.name.charAt(0).toUpperCase())}
              </div>
              <div class="min-w-0">
                <h3 class="text-base font-extrabold text-slate-900 truncate">${escapeHtml(worker.name)}</h3>
                <p class="text-xs font-bold text-emerald-700 truncate">${escapeHtml(wp.specialty)}</p>
              </div>
            </div>

            <!-- Район, бажана оплата та лічильник виконаних завдань -->
            <div class="flex flex-wrap items-center gap-1.5 mb-3 text-xs">
              <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-semibold">
                📍 ${escapeHtml(wp.district)}
              </span>
              <span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-800 font-extrabold border border-emerald-200">
                💰 ${escapeHtml(wp.rate)}
              </span>
              <span class="px-2.5 py-1 rounded-lg bg-amber-50 text-amber-900 font-bold">
                ✅ Виконано: ${stats.completedTasks}
              </span>
            </div>

            ${
              wp.bio
                ? `<p class="text-xs text-slate-600 mb-4 line-clamp-2 leading-relaxed">${escapeHtml(wp.bio)}</p>`
                : `<p class="text-xs text-slate-400 italic mb-4">Додатковий опис не вказано</p>`
            }

            <!-- Прямі контакти виконавця -->
            <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 mb-4 space-y-2 text-xs">
              <div class="flex items-center justify-between gap-2">
                <a href="tel:${escapeHtml(worker.phone)}" class="font-extrabold text-slate-900 hover:text-emerald-600">
                  📞 ${escapeHtml(worker.phone)}
                </a>
                <button
                  type="button"
                  onclick="copyToClipboard('${escapeHtml(worker.phone)}', 'Телефон скопійовано!')"
                  class="px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-700 font-bold hover:bg-slate-100"
                >
                  Копіювати
                </button>
              </div>
              ${
                tgChatUrl
                  ? `<a
                      href="${tgChatUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="flex items-center justify-center gap-1.5 w-full py-1.5 rounded-xl bg-sky-100 hover:bg-sky-200 text-sky-900 font-extrabold transition"
                    >
                      <span>✈️ Чат у Telegram (${escapeHtml(formatTelegramDisplay(worker.telegram))})</span>
                    </a>`
                  : `<div class="text-slate-500 truncate">✉️ ${escapeHtml(worker.email)}</div>`
              }
            </div>
          </div>

          <!-- Кнопки дій -->
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
            <button
              type="button"
              onclick="openInviteWorkerModal('${worker.id}')"
              class="py-2.5 px-2.5 rounded-xl bg-[#0F172A] hover:bg-emerald-600 text-white text-xs font-extrabold transition"
            >
              📨 Запропонувати роботу
            </button>
            <button
              type="button"
              onclick="openReputationModal('${worker.id}')"
              class="py-2.5 px-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-950 text-xs font-extrabold transition"
            >
              ⭐ Відгуки (${stats.count})
            </button>
          </div>
        </article>
      `;
    }

    function updateWorkerFilter(key, val) {
      triggerHaptic('light');
      ui.workerFilters[key] = val;
      renderApp();
    }

    function resetWorkerFilters() {
      triggerHaptic('light');
      ui.workerFilters = {
        search: '',
        district: 'ALL',
        onlyAvailable: false,
        sort: 'rating_desc',
      };
      renderApp();
    }

    /*************************************************************************
     * 10. ЗАПРОПОНУВАТИ РОБОТУ ВИКОНАВЦЮ
     *************************************************************************/
    function openInviteWorkerModal(workerId) {
      const currentUser = getCurrentUser();
      if (!currentUser) {
        showToast('Щоб запропонувати роботу виконавцю, увійдіть як роботодавець.', 'info');
        openAuthModal('register', 'employer');
        return;
      }
      if (currentUser.role !== 'employer') {
        showToast('Запропонувати роботу можуть лише користувачі з роллю «Роботодавець».', 'warning');
        return;
      }

      const worker = getUserById(workerId);
      if (!worker) return;

      const myActiveJobs = state.jobs.filter(
        (j) => j.employerId === currentUser.id && j.status === 'active'
      );

      closeAllModals();
      triggerHaptic('light');
      updateTelegramClosingConfirmation(true);

      const root = document.getElementById('modal-root');
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/65 backdrop-blur-sm';
      modal.innerHTML = `
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 animate-modal">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="text-lg font-extrabold text-slate-900">📨 Запропонувати роботу</h3>
              <p class="text-xs text-slate-500">Виконавець: <strong class="text-slate-900">${escapeHtml(worker.name)}</strong> (${escapeHtml(worker.workerProfile?.specialty || '')})</p>
            </div>
            <button type="button" onclick="closeAllModals()" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100">✕</button>
          </div>

          <form onsubmit="handleInviteWorkerSubmit(event, '${worker.id}')" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Ваша вакансія або індивідуальне завдання</label>
              <select
                name="jobId"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm bg-white"
              >
                <option value="">✨ Індивідуальне запрошення (без прив'язки до вакансії)</option>
                ${myActiveJobs
                  .map(
                    (j) =>
                      `<option value="${j.id}">💼 ${escapeHtml(j.title)} (${escapeHtml(j.pay)} — ${escapeHtml(j.district)})</option>`
                  )
                  .join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Повідомлення виконавцю *</label>
              <textarea
                name="message"
                rows="3"
                required
                placeholder="Вітаю! Є підробіток у Львові, підходить ваш досвід. Розрахунок одразу після виконання..."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm"
              ></textarea>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2">
              <button type="button" onclick="closeAllModals()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50">
                Скасувати
              </button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold shadow-sm">
                Надіслати запрошення
              </button>
            </div>
          </form>
        </div>
      `;
      root.appendChild(modal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeAllModals();
      });
    }

    function handleInviteWorkerSubmit(e, workerId) {
      e.preventDefault();
      const currentUser = getCurrentUser();
      if (!currentUser || currentUser.role !== 'employer') return;

      const fd = new FormData(e.target);
      const jobId = String(fd.get('jobId') || '') || null;
      const message = String(fd.get('message') || '').trim();
      if (!message) return;

      state.invitations.push({
        id: generateId('inv'),
        employerId: currentUser.id,
        workerId,
        jobId,
        message,
        status: 'pending',
        createdAt: Date.now(),
      });
      saveState();
      closeAllModals();
      triggerHaptic('medium');
      showToast('Запрошення успішно надіслано виконавцю!', 'success');
      renderApp();
    }

    /*************************************************************************
     * 11. СИСТЕМА ВЗАЄМНОЇ РЕПУТАЦІЇ ТА ОЦІНЮВАННЯ
     *************************************************************************/
    function openReputationModal(targetUserId, promptTitle = null) {
      const targetUser = getUserById(targetUserId);
      if (!targetUser) return;
      closeAllModals();
      triggerHaptic('light');
      updateTelegramClosingConfirmation(true);

      const currentUser = getCurrentUser();
      const stats = getUserStats(targetUser.id);
      const userReviews = state.reviews
        .filter((r) => r.toUserId === targetUser.id)
        .sort((a, b) => b.updatedAt - a.updatedAt);

      const myExistingReview = currentUser
        ? userReviews.find((r) => r.fromUserId === currentUser.id)
        : null;

      const isWorker = targetUser.role === 'worker';
      const tgChatUrl = getTelegramDirectUrl(targetUser.telegram);

      const root = document.getElementById('modal-root');
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/65 backdrop-blur-sm overflow-y-auto';
      modal.innerHTML = `
        <div class="bg-white rounded-3xl max-w-xl w-full p-5 sm:p-7 shadow-2xl border border-slate-200 my-auto animate-modal max-h-[92vh] overflow-y-auto">
          <div class="flex items-start justify-between gap-3 mb-4">
            <div>
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold ${
                  isWorker ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'
                }">
                  ${isWorker ? '👷 Виконавець' : '💼 Роботодавець'}
                </span>
                <span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 text-xs font-bold">
                  ✅ Виконано завдань: ${stats.completedTasks}
                </span>
              </div>
              <h2 class="text-xl font-extrabold text-slate-900">${escapeHtml(targetUser.name)}</h2>
              ${
                isWorker && targetUser.workerProfile
                  ? `<p class="text-xs font-bold text-emerald-700 mt-0.5">${escapeHtml(targetUser.workerProfile.specialty)} • ${escapeHtml(targetUser.workerProfile.district)}</p>`
                  : ''
              }
            </div>
            <button type="button" onclick="closeAllModals()" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100">✕</button>
          </div>

          ${
            promptTitle
              ? `<div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-950 mb-4">
                  🎉 ${escapeHtml(promptTitle)}
                </div>`
              : ''
          }

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
            <div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-between">
              <div>
                <div class="text-[11px] font-bold uppercase text-amber-800">Рейтинг</div>
                <div class="text-xl font-black text-amber-950 mt-0.5">${stats.label}</div>
              </div>
              <div class="text-right text-xs text-amber-800 font-bold">
                Відгуків: <strong>${stats.count}</strong>
              </div>
            </div>

            <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs space-y-1">
              <div class="font-bold text-slate-500 uppercase text-[10px]">Контакти</div>
              <div class="font-extrabold text-slate-900">📞 ${escapeHtml(targetUser.phone)}</div>
              ${
                tgChatUrl
                  ? `<a href="${tgChatUrl}" target="_blank" rel="noopener noreferrer" class="inline-block text-sky-600 font-bold hover:underline">
                      ✈️ Написати в Telegram (${escapeHtml(formatTelegramDisplay(targetUser.telegram))})
                    </a>`
                  : `<div class="text-slate-600 truncate">✉️ ${escapeHtml(targetUser.email)}</div>`
              }
            </div>
          </div>

          ${
            !currentUser
              ? `<div class="p-3.5 rounded-2xl bg-slate-100 text-xs text-center text-slate-600 mb-5">
                  <button type="button" onclick="openAuthModal('login')" class="text-emerald-600 font-extrabold hover:underline">Увійдіть в акаунт</button>, щоб залишити оцінку та відгук.
                </div>`
              : currentUser.id === targetUser.id
              ? `<div class="p-3 rounded-2xl bg-slate-100 text-xs text-center text-slate-500 mb-5">
                  Це ваш власний профіль.
                </div>`
              : `<form onsubmit="handleSaveReviewSubmit(event, '${targetUser.id}')" class="p-4 rounded-2xl bg-slate-50 border border-slate-200 mb-5 space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-extrabold uppercase text-slate-700">
                      ${myExistingReview ? '✏️ Оновити ваш відгук' : '⭐ Залишити оцінку (1–5)'}
                    </span>
                    <div class="flex items-center gap-1" id="star-picker">
                      ${[1, 2, 3, 4, 5]
                        .map((star) => {
                          const currentVal = myExistingReview ? Number(myExistingReview.rating) : 5;
                          return `
                            <button
                              type="button"
                              data-star="${star}"
                              onclick="selectReviewStar(${star})"
                              class="text-2xl leading-none transition hover:scale-110 ${
                                star <= currentVal ? 'text-amber-400' : 'text-slate-300'

                            >
                              ★
                            </button>
                          `;
                        })
                        .join('')}
                    </div>
                  </div>
                  <input type="hidden" name="rating" id="review-rating-input" value="${myExistingReview ? myExistingReview.rating : 5}" />
                  <textarea

                    rows="2"
                    required
                    placeholder="Як пройшла співпраця? (пунктуальність, оплата, якість виконання)..."

    function selectReviewStar(val) {
      triggerHaptic('light');
      const input = document.getElementById('review-rating-input');
      if (input) input.value = val;
      const buttons = document.querySelectorAll('#star-picker button');
      buttons.forEach((btn) => {
        const s = Number(btn.getAttribute('data-star'));
        btn.className = `text-2xl leading-none transition hover:scale-110 ${
          s <= val ? 'text-amber-400' : 'text-slate-300'
        }`;
      });
    }

    function handleSaveReviewSubmit(e, targetUserId) {
      e.preventDefault();
      const currentUser = getCurrentUser();
      if (!currentUser || currentUser.id === targetUserId) return;

      const fd = new FormData(e.target);
      const rating = Math.min(5, Math.max(1, Number(fd.get('rating') || 5)));
      const comment = String(fd.get('comment') || '').trim();
      if (!comment) return;

      const existingIdx = state.reviews.findIndex(
        (r) => r.fromUserId === currentUser.id && r.toUserId === targetUserId
      );

      if (existingIdx >= 0) {
        state.reviews[existingIdx].rating = rating;
        state.reviews[existingIdx].comment = comment;
        state.reviews[existingIdx].updatedAt = Date.now();
        showToast('Ваш відгук оновлено!', 'success');
      } else {
        state.reviews.push({
          id: generateId('rev'),
          fromUserId: currentUser.id,
          toUserId: targetUserId,
          rating,
          comment,
          updatedAt: Date.now(),
        });
        showToast('Дякуємо! Відгук додано до репутації.', 'success');
      }

      saveState();
      triggerHaptic('medium');
      openReputationModal(targetUserId);
      renderApp();
    }

                  <button
                    type="button"
                    onclick="navigateTo('cabinet', '${t.id}')"
                    class="shrink-0 px-4 py-2.5 rounded-xl text-xs font-extrabold border transition ${
                      ui.cabinetSubTab === t.id
                        ? 'bg-[#0F172A] text-white border-[#0F172A]'
                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                    }"
                  >
                    ${t.label}
                  </button>
                `
              )
              .join('')}
          </div>

          ${bodyHtml}
        </section>
      `;
    }

    function toggleWorkerAvailability(isAvailable) {
      triggerHaptic('light');
      const user = getCurrentUser();
      if (!user || user.role !== 'worker' || !user.workerProfile) return;
      user.workerProfile.isAvailable = isAvailable;
      saveState();
      showToast(
        isAvailable ? 'Статус змінено: «🟢 Вільний»' : 'Статус змінено: «🟡 Зайнятий»',
        'success'
      );
      renderApp();
    }

    function handleUpdateWorkerProfile(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user || user.role !== 'worker') return;

      const fd = new FormData(e.target);
      user.name = String(fd.get('name') || '').trim();
      user.phone = String(fd.get('phone') || '').trim();
      user.telegram = String(fd.get('telegram') || '').trim();
      user.viber = String(fd.get('viber') || '').trim();

      user.workerProfile = {
        ...user.workerProfile,
        specialty: String(fd.get('specialty') || '').trim(),
        district: String(fd.get('district') || LVIV_DISTRICTS[0].name),
        rate: String(fd.get('rate') || '').trim(),
        bio: String(fd.get('bio') || '').trim(),
      };

      saveState();
      triggerHaptic('medium');
      showToast('Анкету виконавця успішно оновлено!', 'success');
      renderApp();
    }

    function respondToInvitation(invId, status) {
      triggerHaptic('medium');
      const inv = state.invitations.find((i) => i.id === invId);
      if (!inv) return;
      inv.status = status;
      saveState();
      showToast(
        status === 'accepted' ? 'Ви прийняли запрошення! Зв’яжіться з роботодавцем.' : 'Запрошення відхилено.',
        status === 'accepted' ? 'success' : 'info'
      );
      renderApp();
    }

    function markApplicationCompleted(appId) {
      triggerHaptic('medium');
      const app = state.applications.find((a) => a.id === appId);
      if (!app) return;
      app.status = 'completed';
      saveState();
      renderApp();

      const currentUser = getCurrentUser();
      const job = state.jobs.find((j) => j.id === app.jobId);
      if (currentUser && job) {
        const targetId = currentUser.role === 'employer' ? app.workerId : job.employerId;
        if (targetId) {
          openReputationModal(targetId, 'Завдання позначено виконаним! Залиште оцінку 1–5 ⭐');
        }
      }
    }

    function markInvitationCompleted(invId) {
      triggerHaptic('medium');
      const inv = state.invitations.find((i) => i.id === invId);
      if (!inv) return;
      inv.status = 'completed';
      saveState();
      renderApp();

      const currentUser = getCurrentUser();
      if (currentUser) {
        const targetId = currentUser.role === 'employer' ? inv.workerId : inv.employerId;
        if (targetId) {
          openReputationModal(targetId, 'Співпрацю позначено виконаною! Залиште відгук 1–5 ⭐');
        }
      }
    }

    // ----------------- КАБІНЕТ РОБОТОДАВЦЯ -----------------
    function renderEmployerCabinet(user) {

      const myJobs = state.jobs.filter((j) => j.employerId === user.id).sort((a, b) => b.createdAt - a.createdAt);

      const myPayments = state.payments.filter((p) => p.userId === user.id).sort((a, b) => b.createdAt - a.createdAt);

      const subTabs = [
        { id: 'main', label: `📋 Мої пропозиції (${myJobs.length})` },
        { id: 'invitations', label: `📨 Запрошення (${mySentInvites.length})` },

      if (!subTabs.some((t) => t.id === ui.cabinetSubTab)) {
        ui.cabinetSubTab = 'main';
      }

      let bodyHtml = '';

      if (ui.cabinetSubTab === 'main') {

                                              ? `<button type="button" onclick="markApplicationCompleted('${app.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-slate-950 text-xs font-extrabold">
                                                  ✅ Виконано

                                              : `<span class="px-2.5 py-1 rounded-lg text-xs font-bold ${
                                                  app.status === 'completed' ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-700'

                                                  ${getAppStatusLabel(app.status)}
                                                </span>`
                                          }
                                          ${

                                              ? `<button type="button" onclick="openReputationModal('${worker.id}')" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 text-xs font-bold">
                                                  ⭐ Оцінити

                                        </div>

                .join('')}

      } else if (ui.cabinetSubTab === 'invitations') {
        bodyHtml =
          mySentInvites.length === 0

                <div class="text-3xl mb-3">📨</div>
                <h3 class="text-lg font-extrabold text-slate-900 mb-1">Ви ще не надсилали запрошень</h3>
                <p class="text-xs text-slate-500 mb-4">Відкрийте каталог «👷 Виконавці», щоб обрати помічника та запропонувати йому роботу.</p>
                <button type="button" onclick="navigateTo('workers')" class="px-5 py-2.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-extrabold">
                  Перейти до виконавців
                </button>
              </div>`
            : `<div class="space-y-3">
                ${mySentInvites
                  .map((inv) => {
                    const worker = getUserById(inv.workerId);
                    return `
                      <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <div class="text-sm font-extrabold text-slate-900">
                            👷 Виконавець: ${worker ? escapeHtml(worker.name) : 'Користувач'}

                          <p class="text-xs text-slate-600 mt-1">${escapeHtml(inv.message)}</p>

                        <div class="flex flex-wrap items-center gap-2">

                              ? 'bg-sky-100 text-sky-900'
                              : inv.status === 'declined'
                              ? 'bg-rose-100 text-rose-700'
                              : 'bg-amber-100 text-amber-900'
                          }">
                            ${
